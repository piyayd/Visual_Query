<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Query</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EXCISE DESIGN SYSTEM — design tokens (from Design Handbook v1.0)
   ============================================================ */
:root{
  /* Primary — Blue */
  --blue-50:#DBF0FF; --blue-100:#B8D8FF; --blue-200:#71B8FF; --blue-300:#2894FF;
  --blue-400:#0070DF; --blue-500:#004C97; --blue-600:#003D7A; --blue-700:#002E5C;
  --blue-800:#001F3D; --blue-900:#000F1F;
  /* Secondary — Amber */
  --amber-100:#FDFD07; --amber-100b:#FDFDD7; --amber-200:#FDDFAF; --amber-300:#FDD087;
  --amber-400:#FCC05F; --amber-500:#FBB033; --amber-600:#FD9605; --amber-700:#B47003;
  --amber-800:#784803; --amber-900:#3C2501;
  /* Neutral */
  --gray-50:#F7F7F7; --gray-100:#F0F0F0; --gray-200b:#E0E1E0; --gray-300:#D1D2D1;
  --gray-400:#C1C3C1; --gray-500:#B2B4B2; --gray-600:#8E908D; --gray-700:#696B69;
  --gray-800:#464846; --gray-900:#232423; --gray-950:#121212;
  /* Semantic backgrounds / foregrounds */
  --bg-page:#F8F9FD; --bg-surface:#FFFFFF; --bg-subtle:#F5F5F5; --bg-muted:#F0F0F0;
  --fg-primary:#232423; --fg-secondary:#464846; --fg-tertiary:#696B69; --fg-brand:#004C97;
  /* Semantic roles */
  --c-error:#F04438; --c-error-bg:#FEF3F2; --c-success:#4F7A0D; --c-success-bg:#F3FAE8;
  --c-warning:#A15C07; --c-warning-bg:#FFFBE8; --c-info:#004C97; --c-info-bg:#DBF0FF;
  /* Spacing scale */
  --space-2xs:2px; --space-xs:4px; --space-s:8px; --space-m:12px; --space-l:16px;
  --space-xl:20px; --space-2xl:24px; --space-3xl:32px; --space-4xl:40px;
  /* Radius */
  --radius-xs:4px; --radius-s:8px; --radius-m:12px; --radius-l:16px; --radius-xl:24px; --radius-full:9999px;
  /* Shadows */
  --shadow-xs:0 1px 2px rgba(35,36,35,.06);
  --shadow-s:0 2px 8px rgba(35,36,35,.08);
  --shadow-l:0 8px 24px rgba(35,36,35,.12);
  --shadow-xl:0 16px 48px rgba(35,36,35,.18);
  /* Fonts */
  --font-th:'Roboto', 'Noto Sans Thai', sans-serif;
  --font-ui:'Roboto', 'Noto Sans Thai', sans-serif;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font-th); color:var(--fg-primary); background:var(--bg-page);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
::selection{background:var(--blue-100);}

.app{ height:100vh; display:flex; flex-direction:column; overflow:hidden; }

/* ---------------- Navbar ---------------- */
.navbar{
  height:56px; flex:0 0 56px; background:var(--bg-surface); border-bottom:1px solid var(--gray-300);
  display:flex; align-items:center; justify-content:space-between; padding:0 var(--space-l);
  position:relative; z-index:30;
}
.navbar-left{ display:flex; align-items:center; gap:var(--space-m); }
.logo{
  width:32px;height:32px;border-radius:var(--radius-s); background:var(--blue-500);
  display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto;
}
.app-title{ font-weight:700; font-size:20px; color:var(--fg-primary); }
.navbar-right{ display:flex; align-items:center; gap:var(--space-m); }
.icon-btn{
  width:34px;height:34px; border-radius:var(--radius-full); border:none; background:transparent;
  color:var(--fg-tertiary); display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .12s;
}
.icon-btn:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.avatar{
  width:32px;height:32px;border-radius:var(--radius-full); background:var(--blue-500); color:#fff;
  display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
}
.navbar-tabs{ display:none; align-items:center; gap:4px; margin-left:var(--space-l); }
.nav-tab{
  height:32px; padding:0 var(--space-l); border-radius:var(--radius-full); border:none; background:none;
  font-size:14px; font-weight:600; color:var(--fg-secondary); cursor:pointer; transition:background .12s,color .12s;
}
.nav-tab:hover:not(.active){ color:var(--fg-brand); }
.nav-tab.active{ background:var(--bg-subtle); color:var(--fg-primary); }
.navbar-user-label{ display:none; font-size:14px; font-weight:600; color:var(--fg-brand); }

/* ---------------- Full-screen data view ---------------- */
.app.fullscreen .canvas-viewport,
.app.fullscreen .panel-tabs,
.app.fullscreen .panel-resize-handle{ display:none !important; }
.app.fullscreen .bottom-panel{ flex:1 1 auto; border-top:none; }

/* ---------------- Toolbar ---------------- */
.toolbar{
  flex:0 0 44px; height:44px; background:var(--bg-surface); border-bottom:1px solid var(--gray-200b);
  display:flex; align-items:center; gap:2px; padding:0 var(--space-l); position:relative; z-index:20;
}
.tb-btn{
  display:flex; align-items:center; gap:6px; height:30px; padding:0 var(--space-m);
  border-radius:var(--radius-s); border:none; background:transparent; color:var(--fg-secondary);
  font-size:13px; font-weight:600; cursor:pointer; transition:background .12s,color .12s;
}
.tb-btn svg{ width:15px;height:15px; }
.tb-btn:hover:not(:disabled){ background:var(--bg-subtle); color:var(--fg-brand); }
.tb-btn:disabled{ color:var(--gray-400); cursor:not-allowed; }
.tb-btn.tb-danger:hover:not(:disabled){ color:var(--c-error); background:var(--c-error-bg); }
.tb-btn.tb-primary{ background:var(--blue-500); color:#fff; }
.tb-btn.tb-primary:hover:not(:disabled){ background:var(--blue-600); color:#fff; }
.tb-divider{ width:1px; height:20px; background:var(--gray-300); margin:0 var(--space-s); }

/* ---------------- Workspace ---------------- */
.workspace{ flex:1 1 auto; display:flex; min-height:0; position:relative; }

/* Right-hand column: canvas + bottom data panel, always to the right of
   the sidebar so the data area never underlaps/overlaps it */
.workspace-main{
  flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;
}

/* Sidebar */
.sidebar{
  width:240px; flex:0 0 240px; background:var(--bg-surface); border-right:1px solid var(--gray-200b);
  overflow-y:auto; overflow-x:hidden; padding:var(--space-m) 0;
  transition:flex-basis .2s ease, width .2s ease, opacity .2s ease, padding .2s ease;
}
.sidebar.collapsed{
  flex-basis:0; width:0; padding-top:0; padding-bottom:0; opacity:0; border-right-color:transparent;
}
.sidebar-toggle{
  position:absolute; top:var(--space-l); left:240px; transform:translateX(-50%); z-index:30;
  width:32px;height:32px; border-radius:var(--radius-full); background:var(--bg-surface);
  border:1px solid var(--gray-300); box-shadow:var(--shadow-s); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--fg-secondary); padding:0; transition:left .2s ease;
}
.sidebar-toggle:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.sidebar-toggle svg{ width:15px;height:15px; transition:transform .2s ease; }
.workspace.sidebar-collapsed .sidebar-toggle{ left:0; }
.workspace.sidebar-collapsed .sidebar-toggle svg{ transform:rotate(180deg); }
.tree-item{
  display:flex; align-items:center; gap:8px; padding:6px var(--space-l); font-size:13px;
  color:var(--fg-secondary); cursor:pointer; user-select:none; white-space:nowrap;
}
.tree-item svg{ width:15px;height:15px; flex:0 0 auto; }
.tree-item.folder{ font-weight:600; color:var(--fg-primary); }
.tree-item.folder .chev{ transition:transform .15s; }
.tree-item.folder.collapsed .chev{ transform:rotate(-90deg); }
.tree-children{ }
.tree-children.collapsed{ display:none; }
.tree-children .tree-children{ padding-left:16px; }
.tree-item.table-item{ padding-left:36px; color:var(--fg-secondary); cursor:grab; }
.tree-item.table-item:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.tree-item.table-item:active{ cursor:grabbing; }
.tree-item.table-item.active{ color:var(--fg-brand); font-weight:600; }
.tree-item.table-item.dragging-row{ opacity:.4; }
.table-dot{
  width:6px;height:6px;border-radius:50%; background:var(--blue-500); margin-left:auto; flex:0 0 auto;
  opacity:0;
}
.tree-item.table-item.active .table-dot{ opacity:1; }

/* Saved views (under the "view" folder) */
.view-entry-folder{ }
.view-entry-children{ padding-bottom:2px; }
.view-entry-children.collapsed{ display:none; }
.view-mode-item{ color:var(--fg-secondary); }
.view-mode-item:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.view-mode-item.active{ color:var(--fg-brand); font-weight:600; }
.view-mode-item.active svg{ color:var(--fg-brand); }
.view-divider{ height:1px; background:var(--gray-200b); margin:6px 16px 6px 56px; }
.view-toggle-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:5px 16px 5px 56px; font-size:12.5px; color:var(--fg-secondary);
}
.toggle-switch{
  position:relative; width:32px; height:18px; border-radius:var(--radius-full);
  border:none; background:var(--gray-400); cursor:pointer; padding:0; flex:0 0 auto; transition:background .15s;
}
.toggle-switch .toggle-knob{
  position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
  background:#fff; box-shadow:var(--shadow-xs); transition:left .15s;
}
.toggle-switch.on{ background:var(--blue-500); }
.toggle-switch.on .toggle-knob{ left:16px; }
.rest-api-controls{ display:flex; align-items:center; gap:6px; }
.rest-icon-btn{
  display:flex; align-items:center; justify-content:center; width:20px;height:20px; padding:0;
  border:none; background:transparent; color:var(--blue-500); cursor:pointer; border-radius:var(--radius-s);
}
.rest-icon-btn svg{ width:15px;height:15px; }
.rest-icon-btn:hover{ background:var(--blue-50); }
.view-delete-btn{
  display:flex; align-items:center; gap:8px; width:calc(100% - 16px); margin:4px 8px 4px 48px;
  padding:6px 10px; border:none; background:transparent; border-radius:var(--radius-s);
  color:var(--c-error); font-size:12.5px; font-weight:600; cursor:pointer; transition:background .12s;
}
.view-delete-btn svg{ width:14px;height:14px; }
.view-delete-btn:hover{ background:var(--c-error-bg); }

/* Canvas */
.canvas-viewport{
  flex:1 1 auto; position:relative; overflow:hidden; min-width:0; min-height:0;
}
.canvas-wrap{
  position:absolute; inset:0; overflow:hidden; background-color:var(--bg-page);
  background-image:radial-gradient(var(--gray-300) 1px, transparent 1px);
  background-size:18px 18px;
}
.canvas-wrap.panning{ cursor:grabbing; }
.canvas-wrap.drop-target{ box-shadow:inset 0 0 0 3px var(--blue-300); }
.canvas{
  position:absolute; top:0; left:0; width:3000px; height:2000px;
  transform-origin:0 0;
}
.conn-layer{ position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.nodes-layer{ position:absolute; top:0; left:0; width:100%; height:100%; }
.pill-layer{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; }

/* Table node */
.tnode{
  position:absolute; width:224px; background:var(--bg-surface); border:1px solid var(--gray-300);
  border-radius:var(--radius-m); box-shadow:var(--shadow-s);
}
.tnode.dragging{ box-shadow:var(--shadow-l); z-index:15; }
.tnode-head{
  height:32px; background:var(--blue-500); color:#fff; display:flex; align-items:center;
  justify-content:space-between; padding:0 10px; font-size:13px; font-weight:700; cursor:grab;
  border-radius:var(--radius-m) var(--radius-m) 0 0;
}
.tnode-head:active{ cursor:grabbing; }
.tnode-title-wrap{ display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto; }
.tnode-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tnode-close{
  width:24px;height:24px; border-radius:50%; border:none; background:rgba(255,255,255,.16); color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.tnode-close:hover{ background:rgba(255,255,255,.32); }
.tnode-close svg{ width:14px;height:14px; }
.tnode-body{ }
.trow{
  display:flex; align-items:center; gap:8px; height:28px; padding:0 10px; font-size:12.5px;
  border-bottom:1px solid var(--bg-muted); position:relative; cursor:pointer; transition:background .1s;
}
.trow:last-child{ border-bottom:none; }
.trow:hover{ background:var(--bg-subtle); }
.trow.locked{ background:var(--blue-50); }
.trow.locked:hover{ background:#CFE6FF; }
.trow.dim{ opacity:.55; }
.col-filter-badge{
  display:flex; align-items:center; justify-content:center; color:var(--fg-brand); flex:0 0 auto; margin-left:1px;
}
.col-filter-badge svg{ width:12px;height:12px; }
.chk{
  width:14px;height:14px;border-radius:4px;border:1.5px solid var(--gray-400); flex:0 0 auto;
  display:flex;align-items:center;justify-content:center; cursor:pointer; background:#fff;
}
.chk svg{ width:10px;height:10px; opacity:0; }
.chk.checked{ background:var(--blue-500); border-color:var(--blue-500); }
.chk.checked svg{ opacity:1; stroke:#fff; }
.chk.locked{ background:var(--gray-300); border-color:var(--gray-300); cursor:pointer; }
.chk.locked svg{ opacity:1; stroke:var(--gray-700); }
.chk-head{ border-color:rgba(255,255,255,.75); background:transparent; }
.chk-head.checked, .chk-head.indeterminate{ background:#fff; border-color:#fff; }
.chk-head.checked svg, .chk-head.indeterminate svg{ opacity:1; stroke:var(--blue-500); }
.col-name-wrap{ display:flex; align-items:center; gap:4px; flex:1 1 auto; min-width:0; }
.col-name{ flex:0 1 auto; min-width:0; color:var(--fg-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-ui); }
.trow.locked .col-name{ color:var(--fg-tertiary); }
.col-type{ font-style:italic; color:var(--gray-600); font-size:11px; flex:0 0 auto; font-family:var(--font-ui); }
.dot-l, .dot-r{
  position:absolute; top:50%; transform:translateY(-50%); width:9px;height:9px;border-radius:50%;
  background:var(--bg-surface); border:2px solid var(--blue-400); cursor:crosshair; opacity:0; transition:opacity .1s, transform .1s;
}
.dot-l{ left:-5px; } .dot-r{ right:-5px; }
.trow:hover .dot-l, .trow:hover .dot-r{ opacity:1; }
.dot-l:hover, .dot-r:hover{ transform:translateY(-50%) scale(1.4); background:var(--blue-400); }

/* join pill on connection */
.join-pill{
  position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:space-between;
  box-sizing:border-box; width:72px; height:24px;
  background:var(--bg-surface); border:1px solid var(--gray-300); border-radius:var(--radius-full);
  padding:3px 8px 3px 10px; font-size:11px; font-weight:600; color:var(--fg-secondary); cursor:pointer;
  box-shadow:var(--shadow-xs); white-space:nowrap; user-select:none; pointer-events:auto;
}
.join-pill:hover{ border-color:var(--blue-400); color:var(--fg-brand); }
.join-pill svg{ width:11px;height:11px; flex:0 0 auto; }
.join-menu{
  position:absolute; background:var(--bg-surface); border:1px solid var(--gray-300); border-radius:var(--radius-s);
  box-shadow:var(--shadow-l); padding:4px; z-index:60; min-width:80px;
}
.join-menu button{
  display:block; width:100%; text-align:left; padding:6px 10px; border:none; background:none;
  font-size:12.5px; border-radius:var(--radius-xs); cursor:pointer; color:var(--fg-primary);
}
.join-menu button:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.join-menu button.sel{ color:var(--fg-brand); font-weight:700; }

.user-menu{
  position:absolute; background:var(--bg-surface); border:1px solid var(--gray-300); border-radius:var(--radius-s);
  box-shadow:var(--shadow-l); padding:6px; z-index:120; min-width:180px;
}
.user-menu-header{ padding:8px 10px 6px; }
.user-menu-name{ font-size:13.5px; font-weight:700; color:var(--fg-primary); }
.user-menu-role{ font-size:12px; color:var(--fg-tertiary); margin-top:1px; }
.user-menu-divider{ height:1px; background:var(--gray-200b); margin:4px 2px; }
.user-menu-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 10px; border:none;
  background:none; font-size:13px; font-weight:600; border-radius:var(--radius-xs); cursor:pointer; color:var(--fg-primary);
}
.user-menu-item svg{ width:15px;height:15px; flex:0 0 auto; }
.user-menu-item:hover{ background:var(--c-error-bg); color:var(--c-error); }

/* zoom controls */
.zoom-controls{
  position:absolute; left:0; bottom:var(--space-l); display:flex; flex-direction:column;
  background:var(--bg-surface); border:1px solid var(--gray-300); border-left:none;
  border-radius:0 var(--radius-s) var(--radius-s) 0;
  box-shadow:var(--shadow-s); overflow:hidden; z-index:25;
}
.zoom-controls button{
  width:32px;height:32px; border:none; background:none; border-bottom:1px solid var(--gray-200b);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--fg-secondary);
}
.zoom-controls button:last-child{ border-bottom:none; }
.zoom-controls button:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.zoom-controls button.active{ color:var(--fg-brand); background:var(--blue-50); }
.zoom-controls svg{ width:15px;height:15px; }

/* minimap */
.minimap-dock{
  position:absolute; right:0; bottom:var(--space-l); z-index:25;
}
.minimap{
  width:150px;height:96px;
  background:rgba(255,255,255,.9); border:1px solid var(--gray-300); border-right:none;
  border-radius:var(--radius-s) 0 0 var(--radius-s);
  box-shadow:var(--shadow-s); overflow:hidden;
  transition:width .18s ease, opacity .18s ease, border-width .18s ease;
}
.minimap-toggle{
  position:absolute; top:50%; left:0; transform:translate(-50%,-50%); z-index:2;
  width:32px;height:32px; border-radius:var(--radius-full); background:var(--bg-surface);
  border:1px solid var(--gray-300); box-shadow:var(--shadow-s); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--fg-secondary); padding:0; transition:left .18s ease;
}
.minimap-toggle:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.minimap-toggle svg{ width:15px;height:15px; transition:transform .18s ease; }
.minimap-dock.collapsed .minimap{ width:0; border-width:0; opacity:0; }
.minimap-dock.collapsed .minimap-toggle svg{ transform:rotate(180deg); }

/* ---------------- Bottom panel ---------------- */
.bottom-panel{
  position:relative; flex:0 0 260px; background:var(--bg-surface); border-top:1px solid var(--gray-300);
  display:flex; flex-direction:column; min-height:0; min-width:0; width:100%;
  transition:flex-basis .18s ease;
}
.bottom-panel.expanded{ flex-basis:70vh; }
.bottom-panel.resizing{ transition:none; }
.panel-resize-handle{
  position:absolute; top:0; left:50%; transform:translate(-50%,-50%); z-index:10;
  width:56px; height:20px; border-radius:var(--radius-full); background:var(--bg-surface);
  border:1px solid var(--gray-300); box-shadow:var(--shadow-s); color:var(--gray-500);
  display:flex; align-items:center; justify-content:center;
  cursor:row-resize; touch-action:none; padding:0;
}
.panel-resize-handle:hover{ border-color:var(--blue-400); color:var(--fg-brand); }
.panel-resize-handle:active{ color:var(--fg-brand); }
.panel-resize-handle .prh-icon{ width:16px;height:16px; transition:color .12s; }
.panel-tabs{
  flex:0 0 auto; min-height:38px; display:flex; align-items:center; padding:0 var(--space-m); gap:2px;
  border-bottom:1px solid var(--gray-200b); flex-wrap:wrap;
}
.panel-tab{
  height:38px; padding:0 var(--space-m); border:none; background:none; font-size:13px; font-weight:700;
  color:var(--fg-tertiary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.panel-tab.active{ color:var(--fg-brand); border-bottom-color:var(--blue-500); }
.panel-spacer{ flex:1 1 auto; }
.fs-btn{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--fg-tertiary);
  background:none; border:none; cursor:pointer; padding:6px 8px; border-radius:var(--radius-xs);
  margin-left:auto; flex:0 0 auto; white-space:nowrap;
}
.fs-btn:hover{ color:var(--fg-brand); background:var(--bg-subtle); }
.fs-btn svg{ width:13px;height:13px; flex:0 0 auto; }
.app.fullscreen .fs-btn { display:none; }

/* The new Minimize Button (visible only in full screen mode) */
.min-btn{
  display:none; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--fg-tertiary);
  background:none; border:none; cursor:pointer; padding:6px 8px; border-radius:var(--radius-xs);
  margin-left:auto; flex:0 0 auto; white-space:nowrap;
}
.min-btn:hover{ color:var(--fg-brand); background:var(--bg-subtle); }
.min-btn svg{ width:13px;height:13px; flex:0 0 auto; }
.app.fullscreen .min-btn { display:flex; }

/* Collapse button labels to icons only once space gets tight, so the
   Full Screen / Minimize Screen actions never get clipped or pushed off-screen */
@media (max-width: 640px){
  .export-btn .btn-label,
  .fs-btn .btn-label,
  .min-btn .btn-label{ display:none; }
  .export-btn, .fs-btn, .min-btn{ padding:6px; }
}

.panel-body{ flex:1 1 auto; overflow:auto; min-height:0; }
.tab-content{ height:100%; display:flex; flex-direction:column; }
.tab-content[hidden]{ display:none; }

/* Data table */
.data-toolbar{
  flex:0 0 auto; padding:var(--space-s) var(--space-l); display:flex; align-items:center; gap:var(--space-m);
  border-bottom:1px solid var(--bg-muted); flex-wrap:wrap; row-gap:8px; min-width:0;
}
.export-btn{
  display:flex; align-items:center; gap:6px; height:30px; padding:0 var(--space-m);
  font-size:12.5px; font-weight:600; color:var(--fg-secondary); font-family:var(--font-ui);
  background:var(--bg-surface); border:1.5px solid var(--gray-300); border-radius:var(--radius-s); cursor:pointer;
  flex:0 0 auto; white-space:nowrap;
}
.export-btn:hover{ border-color:var(--blue-400); color:var(--fg-brand); }
.export-btn svg{ width:14px;height:14px; flex:0 0 auto; }
.rpp-inline{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--fg-tertiary); flex:0 0 auto; white-space:nowrap; }
.data-scroll{ flex:1 1 auto; overflow:auto; }
table.dgrid{ border-collapse:collapse; width:max-content; min-width:100%; font-family:var(--font-ui); }
table.dgrid thead th{
  position:sticky; top:0; background:var(--blue-500); color:#fff; text-align:left; font-size:12px;
  font-weight:700; padding:8px 14px; white-space:nowrap; z-index:2;
}
table.dgrid tbody td{
  padding:7px 14px; font-size:12.5px; color:var(--fg-primary); white-space:nowrap; border-bottom:1px solid var(--bg-muted);
}
table.dgrid tbody tr:nth-child(even){ background:var(--bg-page); }
table.dgrid tbody tr:hover{ background:var(--blue-50); }

/* Updated Data Footer with fixed pagination layout */
.data-footer {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-m) var(--space-l); border-top: 1px solid var(--bg-muted);
  font-size: 12px; color: var(--fg-tertiary); background: #fff;
  flex-wrap: wrap; gap: 12px; min-width: 0;
}
.data-footer > div:first-child{ white-space:nowrap; }
.footer-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: flex-end; min-width:0; }
.footer-rpp { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; white-space:nowrap; flex:0 0 auto; }
.pager { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: center; flex:0 0 auto; }
.pager button {
  min-width: 28px; height: 28px; border: none; border-radius: 14px; background: var(--gray-100);
  font-size: 12.5px; color: var(--fg-secondary); cursor: pointer; padding: 0 8px; font-family: var(--font-ui);
  display: flex; align-items: center; justify-content: center; transition: background .15s; flex:0 0 auto;
}
.pager button:hover:not(:disabled) { background: var(--gray-200b); color: var(--fg-primary); }
.pager button.cur { background: var(--blue-100); color: var(--blue-600); font-weight: 700; }
.pager button:disabled { background: none; color: var(--gray-400); cursor: default; }

/* Below this width, stack the footer into clear rows so the pager and its
   controls always render in full instead of being squeezed or clipped */
@media (max-width: 640px){
  .data-footer{ flex-direction: column; align-items: stretch; }
  .data-footer > div:first-child{ text-align:center; white-space:normal; }
  .footer-right{ justify-content: center; }
  .pager{ width: 100%; }
}
@media (max-width: 420px){
  .footer-rpp{ width:100%; justify-content:center; }
}

.rpp-trigger{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--gray-300); border-radius:var(--radius-s);
  font-size:12px; font-weight:600; padding:4px 8px; color:var(--fg-secondary); background:#fff; cursor:pointer;
}
.rpp-trigger:hover{ border-color:var(--fg-brand); color:var(--fg-brand); }
.rpp-trigger svg{ width:12px;height:12px; flex:0 0 auto; }
.rpp-trigger.editing{ cursor:text; padding:2px 4px; }
.rpp-trigger .rpp-edit-input{
  width:56px; border:1px solid var(--fg-brand); border-radius:var(--radius-xs); padding:3px 6px;
  font-size:12px; font-weight:600; color:var(--fg-primary); outline:none;
}

.rpp-popover{
  position:absolute; background:var(--bg-surface); border:1px solid var(--gray-300); border-radius:var(--radius-s);
  box-shadow:var(--shadow-l); padding:6px; z-index:130; min-width:190px;
}
.rpp-popover-item{
  display:block; width:100%; text-align:left; padding:7px 10px; border:none; background:none;
  font-size:13px; font-weight:600; border-radius:var(--radius-xs); cursor:pointer; color:var(--fg-primary);
}
.rpp-popover-item:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.rpp-popover-item.sel{ background:var(--bg-subtle); color:var(--fg-brand); }
.rpp-popover-divider{ height:1px; background:var(--gray-200b); margin:4px 2px; }
.rpp-popover-hint{ font-size:11px; color:var(--fg-tertiary); padding:6px 10px 2px; line-height:1.4; }
.empty-state{
  height:100%; min-height:100%; box-sizing:border-box;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--space-s); color:var(--fg-tertiary); font-size:13px; text-align:center; padding:var(--space-l);
}
.empty-state svg{ width:40px;height:40px; color:var(--gray-400); }

/* Toast */
#toastHost{ position:fixed; top:70px; right:24px; display:flex; flex-direction:column; gap:8px; z-index:200; }
.toast{
  display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:var(--radius-s);
  font-size:13px; font-weight:600; box-shadow:var(--shadow-l); animation:toastIn .18s ease;
  border:1px solid;
}
.toast svg{ width:16px;height:16px; flex:0 0 auto; }
.toast.success{ background:var(--c-success-bg); color:var(--c-success); border-color:#CDE8AE; }
.toast.info{ background:var(--c-info-bg); color:var(--fg-brand); border-color:#B8D8FF; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:translateY(0);} }

/* Modal */

.modal-actions{ display:flex; gap:var(--space-s); }
.btn{
  flex:1 1 auto; height:38px; border-radius:var(--radius-full); border:1.5px solid transparent; font-size:13px;

.filt-icon-btn.filt-add:hover{ background:var(--blue-50); }
.filt-icon-btn.filt-del{ color:var(--c-error); }
.filt-icon-btn.filt-del:hover{ background:var(--c-error-bg); }
.filt-order-row{ display:flex; gap:8px; margin-bottom:16px; }
.filt-order-btn{
  flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 6px;
  border:1.5px solid var(--gray-300); border-radius:var(--radius-s); background:#fff; cursor:pointer;
  color:var(--fg-secondary); font-family:var(--font-ui);
}
.filt-order-btn:hover{ border-color:var(--blue-400); }
.filt-order-btn svg{ width:14px;height:14px; }
.filt-order-btn span{ font-size:11px; font-weight:700; }
.filt-order-btn.active{ border-color:var(--blue-500); background:var(--blue-50); color:var(--fg-brand); }
.filt-footer{ display:flex; gap:8px; }
.filt-btn{
  flex:1 1 0; height:34px; border-radius:var(--radius-full); border:1.5px solid transparent; font-size:12.5px;
  font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  font-family:var(--font-ui);
}
.filt-btn svg{ width:13px;height:13px; }
.filt-btn-apply{ background:var(--c-success-bg); color:var(--fg-secondary); }
.filt-btn-apply svg{ stroke:var(--c-success); }
.filt-btn-apply:hover{ background:#E4F3D3; }
.filt-btn-remove{ background:var(--c-error-bg); color:var(--c-error); }
.filt-btn-remove svg{ stroke:var(--c-error); }
.filt-btn-remove:hover{ background:#FBDAD7; }
.filt-btn-cancel{ background:#fff; border-color:var(--gray-300); color:var(--fg-primary); }
.filt-btn-cancel:hover{ border-color:var(--gray-500); }

/* ============================================================
   PIVOT MODE — Google Sheets–style pivot table editor
   ============================================================ */
.pivot-toolbar{ display:none; }
.app.mode-pivot #toolbarMain{ display:none !important; }
.app.mode-pivot .pivot-toolbar{ display:flex !important; }
.app.mode-pivot .sidebar,
.app.mode-pivot .sidebar-toggle,
.app.mode-pivot .canvas-viewport,
.app.mode-pivot #bottomPanel{ display:none !important; }
.app.mode-pivot.fullscreen .pivot-editor{ display:none !important; }


.pivot-page{
  display:none; flex:1 1 auto; min-height:0; min-width:0; overflow:hidden; position:relative;
  background:var(--bg-surface);
}
.app.mode-pivot .pivot-page{ display:flex; }

/* ---------- Left: live results grid ---------- */
.pivot-grid-area{
  flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg-surface);
}

/* ---------- Left: "Pivot table editor" panel ---------- */
.pivot-editor{
  flex:0 0 336px; width:336px; max-width:80vw; min-height:0; display:flex; flex-direction:column; overflow:hidden;
  border-right:1px solid var(--gray-200b); background:var(--bg-surface);
  transition:flex-basis .2s ease, width .2s ease, opacity .2s ease, padding .2s ease;
}
.pivot-editor.closed{
  flex-basis:0; width:0; opacity:0; border-right-color:transparent;
}
.pivot-editor-toggle{
  position:absolute; top:var(--space-l); left:336px; transform:translateX(-50%); z-index:30;
  width:32px;height:32px; border-radius:var(--radius-full); background:var(--bg-surface);
  border:1px solid var(--gray-300); box-shadow:var(--shadow-s); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--fg-secondary); padding:0; transition:left .2s ease;
}
.pivot-editor-toggle:hover{ background:var(--bg-subtle); color:var(--fg-brand); }
.pivot-editor-toggle svg{ width:15px;height:15px; transition:transform .2s ease; }
.pivot-page.editor-collapsed .pivot-editor-toggle{ left:0; }
.pivot-page.editor-collapsed .pivot-editor-toggle svg{ transform:rotate(180deg); }
.pivot-editor-header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:14px 16px; border-bottom:1px solid var(--gray-200b);
}
.pivot-editor-title{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--fg-primary); }
.pivot-editor-title svg{ width:18px;height:18px; color:var(--fg-brand); flex:0 0 auto; }
.pivot-editor-body{ flex:1 1 auto; overflow-y:auto; padding:6px 16px 24px; }

.pivot-section{ padding:14px 0; border-bottom:1px solid var(--gray-200b); }
.pivot-section:last-child{ border-bottom:none; }
.pivot-section-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.pivot-section-head > span{ font-size:14px; font-weight:700; color:var(--fg-primary); }
.pivot-add-btn{
  display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border:none; border-radius:var(--radius-s);
  background:none; color:var(--fg-brand); font-size:12.5px; font-weight:700; font-family:var(--font-ui); cursor:pointer;
}
.pivot-add-btn:hover{ background:var(--blue-50); }
.pivot-field-boxes{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
.pivot-field-boxes:empty{ margin-top:0; }

.pivot-field-box{
  border:1px solid var(--gray-200b); border-radius:var(--radius-s); background:var(--bg-page); padding:10px 10px 12px;
}
.pivot-field-box-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.pivot-field-box-name{
  font-size:12.5px; font-weight:700; color:var(--fg-primary); font-family:var(--font-ui);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
}
.pivot-field-box-del{
  flex:0 0 auto; width:20px;height:20px; border-radius:50%; border:none; background:none; color:var(--fg-tertiary);
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
}
.pivot-field-box-del:hover{ background:var(--c-error-bg); color:var(--c-error); }
.pivot-field-box-del svg{ width:11px;height:11px; }

.pivot-config-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:7px; }
.pivot-config-row label{ font-size:11.5px; color:var(--fg-tertiary); flex:0 0 auto; }
.pivot-select-sm{
  flex:1 1 auto; min-width:0; max-width:172px; height:28px; border:1.5px solid var(--gray-300); border-radius:var(--radius-xs);
  padding:0 22px 0 8px; font-size:12px; font-weight:600; color:var(--fg-primary); background:#fff; outline:none;
  font-family:var(--font-ui); cursor:pointer; appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23696B69' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 6px center; background-size:11px;
  overflow:hidden; text-overflow:ellipsis;
}
.pivot-select-sm:focus{ border-color:var(--blue-400); }
.pivot-checkbox-row{ display:flex; align-items:center; gap:7px; margin-top:9px; font-size:12px; color:var(--fg-secondary); cursor:pointer; }
.pivot-checkbox-row input{ width:14px;height:14px; accent-color:var(--fg-brand); cursor:pointer; }

.pivot-filter-summary{
  display:block; width:100%; text-align:left; height:28px; padding:0 10px; border:1.5px solid var(--gray-300);
  border-radius:var(--radius-xs); background:#fff; font-size:12px; font-weight:600; color:var(--fg-secondary);
  font-family:var(--font-ui); cursor:pointer;
}
.pivot-filter-summary:hover{ border-color:var(--blue-400); color:var(--fg-brand); }

.pivot-field-empty{ padding:16px 6px; text-align:center; color:var(--fg-tertiary); font-size:12.5px; }

/* ---------- Floating popovers: field picker & filter values ---------- */
.pivot-popover{
  position:fixed; background:var(--bg-surface); border:1px solid var(--gray-300); border-radius:var(--radius-s);
  box-shadow:var(--shadow-l); z-index:500; width:266px; max-width:90vw; padding:10px; display:flex; flex-direction:column;
}
.pivot-popover-search{
  flex:0 0 auto; height:32px; border:1.5px solid var(--gray-300); border-radius:var(--radius-s); padding:0 10px;
  font-size:12.5px; color:var(--fg-primary); outline:none; font-family:var(--font-ui); background:#fff; margin-bottom:8px;
}
.pivot-popover-search:focus{ border-color:var(--blue-400); }
.pivot-popover-list{ max-height:240px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
.pivot-popover-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left;
  height:34px; padding:0 8px; border:none; border-radius:var(--radius-xs); background:none; cursor:pointer;
  font-size:12.5px; color:var(--fg-primary); font-family:var(--font-ui);
}
.pivot-popover-item:hover{ background:var(--blue-50); color:var(--fg-brand); }
.pivot-popover-item-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.pivot-popover-item-type{ font-style:italic; color:var(--gray-600); font-size:11px; flex:0 0 auto; }

.pivot-filter-popover{ width:276px; }
.pivot-filter-actions{ display:flex; gap:10px; padding:2px 2px 8px; }
.pivot-filter-actions button{
  border:none; background:none; color:var(--fg-brand); font-size:12px; font-weight:700; cursor:pointer; padding:0;
  font-family:var(--font-ui);
}
.pivot-filter-actions button:hover{ text-decoration:underline; }
.pivot-filter-values{ max-height:220px; overflow-y:auto; display:flex; flex-direction:column; }
.pivot-filter-item{ display:flex; align-items:center; gap:8px; padding:6px 4px; font-size:12.5px; color:var(--fg-primary); cursor:pointer; font-family:var(--font-ui); }
.pivot-filter-item input{ width:14px;height:14px; accent-color:var(--fg-brand); cursor:pointer; flex:0 0 auto; }
.pivot-filter-item span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pivot-filter-footer{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--gray-200b); }
.pivot-btn-cancel, .pivot-btn-ok{
  height:30px; padding:0 14px; border-radius:var(--radius-s); font-size:12.5px; font-weight:700; cursor:pointer;
  font-family:var(--font-ui); border:1.5px solid var(--gray-300); background:#fff; color:var(--fg-primary);
}
.pivot-btn-cancel:hover{ border-color:var(--gray-500); }
.pivot-btn-ok{ border-color:var(--blue-500); background:var(--blue-500); color:#fff; }
.pivot-btn-ok:hover{ background:var(--blue-600); border-color:var(--blue-600); }

/* ---------- Grand Total styling in the results grid ---------- */
table.dgrid tr.gt-row td{ font-weight:700; background:var(--bg-subtle); border-top:2px solid var(--gray-300); }
table.dgrid td.gt-cell{ font-weight:700; background:var(--bg-subtle); }
table.dgrid th.gt-cell{ background:var(--blue-600); }

@media (max-width: 900px){
  .pivot-page{ flex-direction:column; }
  .pivot-editor{ flex:0 0 auto; width:100%; max-width:none; max-height:46vh; border-right:none; border-bottom:1px solid var(--gray-200b); }
  .pivot-editor-toggle{ display:none; }
}

/* scrollbars */
::-webkit-scrollbar{ width:9px;height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--gray-400); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--gray-600); }
</style>
</head>
<body>
<div class="app">

  <header class="navbar">
    <div class="navbar-left">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      </div>

        <button class="nav-tab active" id="navTabVQ">Visual Query</button>
        <button class="nav-tab" id="navTabDE">Data Explorer</button>
      </div>
    </div>
    <div class="navbar-right">
      <span class="navbar-user-label" id="navbarUserLabel">system admin</span>
      <button class="avatar" id="avatarBtn" title="Profile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>

  </header>

  <div class="toolbar" id="toolbarMain">
    <button class="tb-btn" id="btnUndo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12H9"/></svg>
      Undo
    </button>
    <button class="tb-btn" id="btnRedo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h5"/></svg>
      Redo
    </button>
    <span class="tb-divider"></span>
    <button class="tb-btn" id="btnRun">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>
      Run
    </button>
    <button class="tb-btn" id="btnSave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      Save
    </button>
    <span class="tb-divider"></span>
    <button class="tb-btn tb-danger" id="btnClear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Clear All
    </button>
    <span class="tb-divider"></span>
    <button class="tb-btn" id="btnPivot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 9v12"/><rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
      Pivot
    </button>
  </div>

  <div class="toolbar pivot-toolbar" id="pivotToolbar">
    <button class="tb-btn" id="btnBackToVisual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Visual Query
    </button>
    <span class="tb-divider"></span>
    <button class="tb-btn tb-danger" id="btnClearPivot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="m19 6-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      Clear
    </button>
    <button class="tb-btn" id="btnRunPivot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8V4z"/></svg>
      Run
    </button>
  </div>

  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse Sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="workspace-main" id="workspaceMain">
      <div class="canvas-viewport" id="canvasViewport">
        <main class="canvas-wrap" id="canvasWrap">
          <div class="canvas" id="canvas">
            <svg class="conn-layer" id="connLayer"></svg>
            <div class="nodes-layer" id="nodesLayer"></div>
            <div class="pill-layer" id="pillLayer"></div>
          </div>
        </main>

        <div class="zoom-controls">
          <button id="zoomIn" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="zoomOut" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <button id="zoomFit" title="Fit view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
          <button id="zoomLock" title="Lock nodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
        </div>

        <div class="minimap-dock" id="minimapDock">
          <button class="minimap-toggle" id="minimapToggle" title="Hide Minimap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <div class="minimap"><svg id="minimapSvg" width="150" height="96"></svg></div>
        </div>
      </div>

      <section class="bottom-panel" id="bottomPanel">
        <button class="panel-resize-handle" id="panelResizeHandle" title="Drag to resize panel" aria-label="Drag to resize panel">
          <svg class="prh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div class="panel-tabs" id="panelTabsRow">
          <button class="panel-tab active" data-tab="data" id="tabBtnData">Data</button>
          <span class="panel-spacer"></span>
        </div>
        <div class="panel-body">
          <div class="tab-content" id="tabData">
            <div class="data-toolbar" id="dataToolbarRow">
              <button class="export-btn" id="btnExportCsv" title="Export data as CSV file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                <span class="btn-label">Export CSV</span>
              </button>
              <div class="rpp-inline">Rows :
                <button type="button" class="rpp-trigger" id="rppTrigger">
                  <span class="rpp-trigger-label">100</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
              </div>
              <button class="fs-btn" id="fsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span class="btn-label">Full Screen</span>
              </button>
              <!-- Dedicated Minimize Screen Button -->
              <button class="min-btn" id="minBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4a2 2 0 0 1-2 2H3M21 9h-4a2 2 0 0 1-2-2V3M3 15h4a2 2 0 0 1 2 2v4M15 21v-4a2 2 0 0 1 2-2h4"/></svg>
                <span class="btn-label">Minimize Screen</span>
              </button>
            </div>
            <div class="data-scroll" id="dataScroll"></div>
            <div class="data-footer" id="dataFooter"></div>
          </div>
        </div>
      </section>

      <div class="pivot-page" id="pivotPage">
        <aside class="pivot-editor" id="pivotEditor">
          <div class="pivot-editor-header">
            <div class="pivot-editor-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 9v12"/></svg>
              Pivot table editor
            </div>
          </div>
          <div class="pivot-editor-body" id="pivotEditorBody">
            <div class="pivot-section" data-zone="rows">
              <div class="pivot-section-head">
                <span>Rows</span>
                <button type="button" class="pivot-add-btn" data-add-zone="rows">+ Add</button>
              </div>
              <div class="pivot-field-boxes" id="pivotRowsBoxes"></div>
            </div>
            <div class="pivot-section" data-zone="cols">
              <div class="pivot-section-head">
                <span>Columns</span>
                <button type="button" class="pivot-add-btn" data-add-zone="cols">+ Add</button>
              </div>
              <div class="pivot-field-boxes" id="pivotColsBoxes"></div>
            </div>
            <div class="pivot-section" data-zone="values">
              <div class="pivot-section-head">
                <span>Values</span>
                <button type="button" class="pivot-add-btn" data-add-zone="values">+ Add</button>
              </div>
              <div class="pivot-field-boxes" id="pivotValuesBoxes"></div>
            </div>
          </div>

/* ============================================================
   COLUMN FILTERS — operators + helpers
   ============================================================ */
const FILTER_OPERATORS = ['Equals','Not equals','Greater than','Less than','Greater than or equals','Less than or equals','Is null','Is not null','Contains','Regex','Distinct'];
const FILTER_NO_VALUE_OPS = ['Is null','Is not null','Distinct'];

function filterConditionIsMeaningful(c){
  return FILTER_NO_VALUE_OPS.includes(c.operator) || (c.value!==undefined && c.value!==null && String(c.value).trim()!=='');
}
function isFilterActive(f){
  if(!f) return false;
  const condActive = Array.isArray(f.conditions) && f.conditions.some(filterConditionIsMeaningful);
  const orderActive = f.order==='asc' || f.order==='desc';
  return condActive || orderActive;
}
function describeFilter(f){
  if(!f) return '';
  const parts = [];
  if(Array.isArray(f.conditions)){
    f.conditions.forEach((c,i)=>{
      if(!filterConditionIsMeaningful(c)) return;
      const conn = (i>0 && parts.length) ? `${c.connector==='OR'?'OR':'AND'} ` : '';
      const valPart = FILTER_NO_VALUE_OPS.includes(c.operator) ? '' : ` "${c.value}"`;
      parts.push(`${conn}${c.operator}${valPart}`);
    });
  }
  let txt = parts.length ? 'Filter: '+parts.join(' ') : '';
  if(f.order==='asc') txt += (txt?'  •  ':'')+'Sort A→Z';
  if(f.order==='desc') txt += (txt?'  •  ':'')+'Sort Z→A';
  return txt || 'Filtered';
}

function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>]/g, (m)=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

function snapshot(){

    conns: conns.map(c=>({id:c.id,order:c.order,fromNode:c.fromNode,fromCol:c.fromCol,toNode:c.toNode,toCol:c.toCol,joinType:c.joinType})),
    nodeSeq, connSeq, orderSeq
  });
}
function restore(snap){
  const d = JSON.parse(snap);
  nodes = d.nodes.map(n=>({...n, selected:new Set(n.selected), filters:n.filters||{}}));
  conns = d.conns.map(c=>({...c}));
  nodeSeq = d.nodeSeq; connSeq = d.connSeq; orderSeq = d.orderSeq;
  render();
}
function pushHistory(){
  history.push(snapshot());
  if(history.length>50) history.shift();
  future = [];
  updateUndoRedoBtns();

  document.getElementById('btnUndo').disabled = history.length===0;

/* ============================================================
   NODE / CONNECTION helpers
   ============================================================ */
function addNode(table, x, y, record=true){
  const n = { id:'n'+(++nodeSeq), table, x, y, order:++orderSeq, selected:new Set(SCHEMA[table].cols.map(c=>c[0])), filters:{} };
  nodes.push(n);
  if(record) pushHistory();
  return n;
}
function findNode(table){ return nodes.find(n=>n.table===table); }

function addConn(fromNode, fromCol, toNode, toCol, joinType='inner', record=true){
  const c = { id:'c'+(++connSeq), order:++orderSeq, fromNode:fromNode.id, fromCol, toNode:toNode.id, toCol, joinType };
  conns.push(c);
  lockCol(fromNode, fromCol);
  lockCol(toNode, toCol);
  if(record) pushHistory();
  return c;
}
function lockCol(node, col){ node.selected.add(col); }
function lockedCols(nodeId){
  const s = new Set();
  conns.forEach(c=>{
    if(c.fromNode===nodeId) s.add(c.fromCol);
    if(c.toNode===nodeId) s.add(c.toCol);
  });
  return s;
}
function removeNode(nodeId, record=true){
  nodes = nodes.filter(n=>n.id!==nodeId);
  conns = conns.filter(c=>c.fromNode!==nodeId && c.toNode!==nodeId);
  if(record) pushHistory();
}

  render();
  showToast('info', `Added table ${table} to the workspace`);
}
function flashNode(nodeId){
  render();
  const el = document.querySelector(`.tnode[data-id="${nodeId}"]`);
  if(el){
    el.style.transition='box-shadow .15s';
    el.style.boxShadow = '0 0 0 3px var(--blue-300)';

/* ============================================================
   SIDEBAR -> CANVAS DRAG & DROP
   Lets a table row in the sidebar be dragged onto the canvas
   area to add it as a node at the dropped position.
   ============================================================ */
function initCanvasDropZone(){
  const wrap = document.getElementById('canvasWrap');
  const canvasEl = document.getElementById('canvas');

  wrap.addEventListener('dragover', (e)=>{
    if(![...e.dataTransfer.types].includes('text/plain')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    wrap.classList.add('drop-target');
  });
  wrap.addEventListener('dragleave', (e)=>{
    if(!wrap.contains(e.relatedTarget)) wrap.classList.remove('drop-target');
  });
  wrap.addEventListener('drop', (e)=>{
    e.preventDefault();
    wrap.classList.remove('drop-target');
    const table = e.dataTransfer.getData('text/plain');
    if(!table || !SCHEMA[table]) return;

    const existing = findNode(table);
    if(existing){ flashNode(existing.id); return; }

    const rect = canvasEl.getBoundingClientRect();
    const x = Math.max(0, (e.clientX - rect.left)/zoom - NODE_W/2);
    const y = Math.max(0, (e.clientY - rect.top)/zoom - HEAD_H/2);
    addNode(table, x, y, false);
    pushHistory();
    render();
    showToast('info', `Added table ${table} to the workspace`);
  });
}

    const headChk = document.createElement('div');
    headChk.className = 'chk chk-head' + (allSelected?' checked':'') + (someSelected?' indeterminate':'');
    headChk.innerHTML = someSelected ? ICONS.minus : ICONS.check;
    headChk.title = allSelected ? 'Deselect all columns' : 'Select all columns';
    headChk.addEventListener('mousedown', (e)=> e.stopPropagation());
    headChk.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(allSelected){
        conns = conns.filter(c=> c.fromNode!==n.id && c.toNode!==n.id);
        n.selected = new Set();
      } else {
        n.selected = new Set(allColKeys);
      }
      pushHistory(); render();
    });
    titleWrap.appendChild(headChk);

    const nameEl = document.createElement('span');
    nameEl.className = 'tnode-title';
    nameEl.textContent = n.table;
    titleWrap.appendChild(nameEl);

    head.appendChild(titleWrap);
    const closeBtn = document.createElement('button');
    closeBtn.className='tnode-close';
    closeBtn.innerHTML = ICONS.close;
    closeBtn.title = 'Remove table from workspace';
    closeBtn.addEventListener('mousedown', (e)=> e.stopPropagation());
    closeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openRemoveNodeModal(n.id, n.table); });
    head.appendChild(closeBtn);
    el.appendChild(head);

    const body = document.createElement('div');
    body.className = 'tnode-body';
    def.cols.forEach(([col,type], idx)=>{
      const isLocked = locked.has(col);
      const isChecked = n.selected.has(col);
      const colFilter = n.filters ? n.filters[col] : null;
      const filterActive = isFilterActive(colFilter);
      const row = document.createElement('div');
      row.className = 'trow' + (isLocked?' locked':'') + (filterActive?' has-filter':'');
      row.dataset.col = col;
      row.title = filterActive ? describeFilter(colFilter) : '';
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.chk') || e.target.closest('.dot-l') || e.target.closest('.dot-r')) return;
        e.stopPropagation();
        openColumnFilterPopover(n, col, row);
      });

      const chk = document.createElement('div');
      chk.className = 'chk' + (isChecked?' checked':'') + (isLocked?' locked':'');
      chk.innerHTML = ICONS.check;
      chk.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(n.selected.has(col)){
          n.selected.delete(col);
          if(isLocked) conns = conns.filter(c=> !((c.fromNode===n.id && c.fromCol===col) || (c.toNode===n.id && c.toCol===col)));
        } else {
          n.selected.add(col);
        }
        pushHistory(); render();
      });
      row.appendChild(chk);

      const nameWrap = document.createElement('span');
      nameWrap.className = 'col-name-wrap';

      const nameEl = document.createElement('span');
      nameEl.className='col-name'; nameEl.textContent = col;
      nameWrap.appendChild(nameEl);

      if(filterActive){
        const badge = document.createElement('span');
        badge.className = 'col-filter-badge';
        badge.innerHTML = ICONS.funnel;
        nameWrap.appendChild(badge);
      }

      row.appendChild(nameWrap);

      const typeEl = document.createElement('span');
      typeEl.className='col-type'; typeEl.textContent = type;
      row.appendChild(typeEl);

      const dotL = document.createElement('div'); dotL.className='dot-l';
      const dotR = document.createElement('div'); dotR.className='dot-r';
      row.appendChild(dotL); row.appendChild(dotR);

      [dotL,dotR].forEach(d=>{
        d.addEventListener('mousedown', (e)=>{ e.stopPropagation(); e.preventDefault(); startConnectionDrag(n, col, e); });
      });

      body.appendChild(row);
    });
    el.appendChild(body);

    head.addEventListener('mousedown', (e)=> startNodeDrag(n, el, e));
    layer.appendChild(el);
  });
  drawConnections();
}

function startNodeDrag(node, el, evt){
  if(locked) return;
  evt.preventDefault();
  const startX = evt.clientX, startY = evt.clientY;
  const ox = node.x, oy = node.y;
  el.classList.add('dragging');
  function onMove(e){
    node.x = ox + (e.clientX-startX)/zoom;
    node.y = oy + (e.clientY-startY)/zoom;
    el.style.left = node.x+'px'; el.style.top = node.y+'px';
    drawConnections(); renderMinimap();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    el.classList.remove('dragging');
    pushHistory(); render();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startConnectionDrag(node, col, evt){
  const canvasEl = document.getElementById('canvas');
  const svg = document.getElementById('connLayer');
  const tempPath = document.createElementNS('http://www.w3.org/2000/svg','path');
  tempPath.setAttribute('stroke', 'var(--blue-400)');
  tempPath.setAttribute('stroke-width','2');
  tempPath.setAttribute('fill','none');
  tempPath.setAttribute('stroke-dasharray','5,4');
  svg.appendChild(tempPath);

  const rect = canvasEl.getBoundingClientRect();
  const idx = SCHEMA[node.table].cols.findIndex(c=>c[0]===col);
  const sx = node.x + NODE_W, sy = rowY(node, idx);

  function onMove(e){
    const mx = (e.clientX-rect.left)/zoom, my = (e.clientY-rect.top)/zoom;
    tempPath.setAttribute('d', bezier(sx,sy,mx,my));
  }
  function onUp(e){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    svg.removeChild(tempPath);
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const rowEl = target && target.closest ? target.closest('.trow') : null;
    const nodeEl = rowEl ? rowEl.closest('.tnode') : null;
    if(rowEl && nodeEl){
      const targetNode = nodes.find(n=>n.id===nodeEl.dataset.id);
      const targetCol = rowEl.dataset.col;
      if(targetNode && !(targetNode.id===node.id && targetCol===col)){
        const already = conns.some(c=>
          (c.fromNode===node.id&&c.fromCol===col&&c.toNode===targetNode.id&&c.toCol===targetCol) ||
          (c.toNode===node.id&&c.toCol===col&&c.fromNode===targetNode.id&&c.fromCol===targetCol));
        if(!already){
          addConn(node, col, targetNode, targetCol, 'inner');
          render();
          showToast('info', `Connected ${node.table}.${col} to ${targetNode.table}.${targetCol} (inner join)`);
        }
      }
    }
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function bezier(x1,y1,x2,y2){
  const dx = Math.max(60, Math.abs(x2-x1)*0.5);
  return `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
}

let openJoinMenu = null;
function drawConnections(){
  const svg = document.getElementById('connLayer');
  const pillLayer = document.getElementById('pillLayer');
  svg.innerHTML = '';
  pillLayer.innerHTML = '';
  conns.forEach(c=>{
    const fn = nodes.find(n=>n.id===c.fromNode), tn = nodes.find(n=>n.id===c.toNode);
    if(!fn||!tn) return;
    const fi = SCHEMA[fn.table].cols.findIndex(x=>x[0]===c.fromCol);
    const ti = SCHEMA[tn.table].cols.findIndex(x=>x[0]===c.toCol);
    let x1,y1,x2,y2;
    if(fn.x <= tn.x){ x1=fn.x+NODE_W; y1=rowY(fn,fi); x2=tn.x; y2=rowY(tn,ti); }
    else { x1=fn.x; y1=rowY(fn,fi); x2=tn.x+NODE_W; y2=rowY(tn,ti); }

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', bezier(x1,y1,x2,y2));
    path.setAttribute('stroke', '#8E908D');
    path.setAttribute('stroke-width','1.6');
    path.setAttribute('fill','none');
    svg.appendChild(path);

    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const pill = document.createElement('div');
    pill.className='join-pill';
    pill.style.left = mx+'px';
    pill.style.top = my+'px';
    pill.innerHTML = `<span>${c.joinType}</span>${ICONS.chev.replace('class="chev"','')}`;
    pill.addEventListener('click', (e)=>{ e.stopPropagation(); toggleJoinMenu(c, pill); });
    pillLayer.appendChild(pill);
  });
}

/* ============================================================
   COLUMN FILTER POPOVER
   ============================================================ */
let filterEditor = null;       // { nodeId, col, conditions:[...], order:null|'asc'|'desc' }
let filterPopoverAnchor = null; // { left, top } — screen coords, cached across re-renders

function openColumnFilterPopover(node, col, rowEl){
  closeColumnFilterPopover();
  closeJoinMenu();
  const existing = node.filters ? node.filters[col] : null;
  filterEditor = {
    nodeId: node.id,
    col,
    conditions: (existing && existing.conditions && existing.conditions.length)
      ? existing.conditions.map(c=>({ connector: c.connector||null, operator: c.operator||'Equals', value: c.value||'' }))
      : [{ connector:null, operator:'Equals', value:'' }],
    order: existing ? (existing.order||null) : null
  };
  const rect = rowEl.getBoundingClientRect();
  filterPopoverAnchor = { left: rect.right + 12, top: Math.max(12, rect.top - 8) };
  renderFilterPopover();
  setTimeout(()=> document.addEventListener('mousedown', onDocMouseDownCloseFilter), 0);
}

function closeColumnFilterPopover(){
  const host = document.getElementById('filterPopoverHost');
  if(host) host.innerHTML = '';
  filterEditor = null;
  document.removeEventListener('mousedown', onDocMouseDownCloseFilter);
}

function onDocMouseDownCloseFilter(e){
  const pop = document.querySelector('.filt-popover');
  if(pop && !pop.contains(e.target)) closeColumnFilterPopover();
}

function renderFilterPopover(){
  const host = document.getElementById('filterPopoverHost');
  if(!host || !filterEditor) return;
  const conds = filterEditor.conditions;

  const rowsHtml = conds.map((c,i)=>{
    const isLast = i===conds.length-1;
    const isFirst = i===0;
    const noVal = FILTER_NO_VALUE_OPS.includes(c.operator);
    let h = '';
    if(!isFirst){
      h += `<div class="filt-conn-toggle">
        <button type="button" class="filt-conn-btn ${c.connector!=='OR'?'active':''}" data-conn-idx="${i}" data-conn-val="AND">AND</button>
        <button type="button" class="filt-conn-btn ${c.connector==='OR'?'active':''}" data-conn-idx="${i}" data-conn-val="OR">OR</button>
      </div>`;
    }
    h += `<div class="filt-row">
      <select class="filt-op-select" data-op-idx="${i}">
        ${FILTER_OPERATORS.map(o=>`<option value="${o}" ${o===c.operator?'selected':''}>${o}</option>`).join('')}
      </select>
      <input type="text" class="filt-val-input" data-val-idx="${i}" placeholder="Value" value="${escapeAttr(c.value||'')}" ${noVal?'disabled':''}>
      <div class="filt-row-actions">
        ${isLast?`<button type="button" class="filt-icon-btn filt-add" data-add-cond title="Add condition">${ICONS.plus}</button>`:''}
        ${!isFirst?`<button type="button" class="filt-icon-btn filt-del" data-del-cond="${i}" title="Remove condition">${ICONS.trash}</button>`:''}
      </div>
    </div>`;
    return h;
  }).join('');

  host.innerHTML = `
    <div class="filt-popover" style="left:${filterPopoverAnchor.left}px; top:${filterPopoverAnchor.top}px;">
      <div class="filt-header">${escapeHtml(filterEditor.col)}</div>
      <div class="filt-section-label">Filter</div>
      ${rowsHtml}
      <div class="filt-section-label" style="margin-top:14px;">Order</div>
      <div class="filt-order-row">
        <button type="button" class="filt-order-btn ${filterEditor.order==='asc'?'active':''}" data-order="asc" title="Sort ascending">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          <span>A–Z</span>
        </button>
        <button type="button" class="filt-order-btn ${filterEditor.order==='desc'?'active':''}" data-order="desc" title="Sort descending">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
          <span>Z–A</span>
        </button>
      </div>
      <div class="filt-footer">
        <button type="button" class="filt-btn filt-btn-apply" id="filtApplyBtn">${ICONS.check} Apply</button>
        <button type="button" class="filt-btn filt-btn-remove" id="filtRemoveBtn">${ICONS.trash} Remove</button>
        <button type="button" class="filt-btn filt-btn-cancel" id="filtCancelBtn">${ICONS.close} Cancel</button>
      </div>
    </div>`;
  clampFilterPopoverPosition();
  wireFilterPopover();
}

function clampFilterPopoverPosition(){
  const pop = document.querySelector('.filt-popover');
  if(!pop) return;
  const r = pop.getBoundingClientRect();
  const margin = 10;
  let left = filterPopoverAnchor.left, top = filterPopoverAnchor.top;
  if(left + r.width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - r.width - margin);
  if(top + r.height > window.innerHeight - margin) top = Math.max(margin, window.innerHeight - r.height - margin);
  pop.style.left = left+'px';
  pop.style.top = top+'px';
}

function wireFilterPopover(){
  const pop = document.querySelector('.filt-popover');
  if(!pop) return;
  pop.addEventListener('mousedown', e=> e.stopPropagation());

  pop.querySelectorAll('[data-op-idx]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const idx = +sel.dataset.opIdx;
      filterEditor.conditions[idx].operator = sel.value;
      const noVal = FILTER_NO_VALUE_OPS.includes(sel.value);
      if(noVal) filterEditor.conditions[idx].value = '';
      const valInput = pop.querySelector(`[data-val-idx="${idx}"]`);
      if(valInput){ valInput.disabled = noVal; if(noVal) valInput.value = ''; }
    });
  });
  pop.querySelectorAll('[data-val-idx]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ filterEditor.conditions[+inp.dataset.valIdx].value = inp.value; });
  });
  pop.querySelectorAll('[data-conn-idx]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.connIdx;
      filterEditor.conditions[idx].connector = btn.dataset.connVal;
      pop.querySelectorAll(`[data-conn-idx="${idx}"]`).forEach(b=>{
        b.classList.toggle('active', b.dataset.connVal===btn.dataset.connVal);
      });
    });
  });
  pop.querySelectorAll('[data-del-cond]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.dataset.delCond;
      filterEditor.conditions.splice(idx,1);
      if(filterEditor.conditions[0]) filterEditor.conditions[0].connector = null;
      renderFilterPopover();
    });
  });
  const addBtn = pop.querySelector('[data-add-cond]');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      filterEditor.conditions.push({ connector:'AND', operator:'Equals', value:'' });
      renderFilterPopover();
    });
  }
  pop.querySelectorAll('[data-order]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset.order;
      filterEditor.order = (filterEditor.order===val) ? null : val;
      pop.querySelectorAll('[data-order]').forEach(b=> b.classList.toggle('active', b.dataset.order===filterEditor.order));
    });
  });

  pop.querySelector('#filtApplyBtn').addEventListener('click', ()=>{
    const node = nodes.find(n=>n.id===filterEditor.nodeId);
    if(node){
      const clean = {
        conditions: filterEditor.conditions.map(c=>({ connector:c.connector, operator:c.operator, value:c.value })),
        order: filterEditor.order
      };
      if(!node.filters) node.filters = {};
      if(isFilterActive(clean)){
        node.filters[filterEditor.col] = clean;
        showToast('success', `Filter applied to "${filterEditor.col}"`);
      } else {
        delete node.filters[filterEditor.col];
      }
      pushHistory(); render();
    }
    closeColumnFilterPopover();
  });
  pop.querySelector('#filtRemoveBtn').addEventListener('click', ()=>{
    const node = nodes.find(n=>n.id===filterEditor.nodeId);
    if(node && node.filters && node.filters[filterEditor.col]){
      delete node.filters[filterEditor.col];
      pushHistory(); render();
      showToast('info', `Filter removed from "${filterEditor.col}"`);
    }
    closeColumnFilterPopover();
  });
  pop.querySelector('#filtCancelBtn').addEventListener('click', closeColumnFilterPopover);
}

function renderMinimap(){
  const svg = document.getElementById('minimapSvg');
  svg.innerHTML='';
  if(nodes.length===0) return;
  const xs = nodes.map(n=>n.x), ys = nodes.map(n=>n.y);
  const minX = Math.min(...xs)-40, maxX = Math.max(...xs)+NODE_W+40;
  const minY = Math.min(...ys)-40, maxY = Math.max(...ys)+200;
  const spanX = Math.max(1,maxX-minX), spanY = Math.max(1,maxY-minY);
  const sx = 150/spanX, sy = 96/spanY, s = Math.min(sx,sy);
  nodes.forEach(n=>{
    const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x', (n.x-minX)*s);
    r.setAttribute('y', (n.y-minY)*s);
    r.setAttribute('width', Math.max(6,NODE_W*s));
    r.setAttribute('height', Math.max(4,60*s));
    r.setAttribute('fill', '#004C97');
    r.setAttribute('rx','1.5');
    svg.appendChild(r);
  });
}

(function initPan(){
  const wrap = document.getElementById('canvasWrap');
  let panning=false, sx=0, sy=0, sl=0, st=0;
  wrap.addEventListener('mousedown', (e)=>{
    if(e.target.closest('.tnode') || e.target.closest('.zoom-controls') || e.target.closest('.minimap-dock') || e.target.closest('.join-pill')) return;
    panning=true; sx=e.clientX; sy=e.clientY; sl=wrap.scrollLeft; st=wrap.scrollTop;

})();
