function genValue(col, type, rand, rowIdx){
  if(/Id$/.test(col)){
    if(col==='TrackId') return 10+rowIdx;
    if(col==='InvoiceLineId') return 100+rowIdx*3;
    if(col==='InvoiceId') return 2+rowIdx;
    if(col==='CustomerId') return 1+(rowIdx%59);
    if(col==='AlbumId') return 1+(rowIdx%347);
    if(col==='ArtistId') return 1+(rowIdx%275);
    if(col==='GenreId') return 1+(rowIdx%25);
    if(col==='MediaTypeId') return 1+(rowIdx%5);
    if(col==='EmployeeId'||col==='SupportRepId') return 1+(rowIdx%8);
    if(col==='PlaylistId') return 1+(rowIdx%18);
    return 1+rowIdx;
  }
  switch(col){
    case 'Name': return type==='string' ? TRACKS[rowIdx%TRACKS.length] : NAMES_FIRST[rowIdx%NAMES_FIRST.length];
    case 'FirstName': return NAMES_FIRST[rowIdx%NAMES_FIRST.length];
    case 'LastName': return NAMES_LAST[rowIdx%NAMES_LAST.length];
    case 'Title': return ['Sales Manager','Support Rep','IT Staff','General Manager'][rowIdx%4];
    case 'Company': return rand()>0.6 ? ['Acme Corp','Globex','Umbrella Ltd','Initech'][rowIdx%4] : '';
    case 'Country': return COUNTRIES[rowIdx%COUNTRIES.length];
    case 'BillingCountry': return COUNTRIES[rowIdx%COUNTRIES.length];
    case 'City': case 'BillingCity': return ['Oslo','Rome','Toronto','São Paulo','Brussels','Prague'][rowIdx%6];
    case 'State': case 'BillingState': return rand()>0.5 ? ['CA','ON','NSW','—'][rowIdx%4] : '';
    case 'PostalCode': case 'BillingPostalCode': return String(1000+ (rowIdx*37)%8999);
    case 'Address': case 'BillingAddress': return ADDR_STREETS[rowIdx%ADDR_STREETS.length];
    case 'Phone': return `+${10+(rowIdx%80)} ${100+rowIdx%900} ${1000+((rowIdx*7)%9000)}`;
    case 'Fax': return rand()>0.7 ? `+${10+(rowIdx%80)} ${100+rowIdx%900} ${1000+((rowIdx*3)%9000)}` : '';
    case 'Email': return `${(NAMES_FIRST[rowIdx%NAMES_FIRST.length]).toLowerCase()}.${(NAMES_LAST[rowIdx%NAMES_LAST.length]).toLowerCase()}@example.com`;
    case 'Composer': return rand()>0.3 ? ['Steven Tyler','J. Perry','A. Young','M. Jagger'][rowIdx%4] : '';
    case 'Milliseconds': return 180000+Math.floor(rand()*200000);
    case 'Bytes': return 3000000+Math.floor(rand()*6000000);
    case 'UnitPrice': return (0.99).toFixed(2);
    case 'Total': return (1+rand()*20).toFixed(2);
    case 'Quantity': return 1+Math.floor(rand()*3);
    case 'InvoiceDate': case 'BirthDate': case 'HireDate': return fmtDate(rand);
    case 'ReportsTo': return rand()>0.3 ? (1+Math.floor(rand()*5)) : '';
  }
  return type==='string' ? '—' : Math.floor(rand()*1000);
}

function collectSelectedColumns(srcNodes){
  const list = srcNodes || nodes;
  const ordered = [...list].sort((a,b)=>a.order-b.order);
  const out = [];
  ordered.forEach(n=>{
    SCHEMA[n.table].cols.forEach(([col,type])=>{
      if(n.selected.has(col)) out.push({table:n.table, col, type});
    });
  });
  return out;
}

/* ============================================================
   COLUMN FILTERS — evaluation against generated mock rows
   ============================================================ */
function collectActiveFilterSpecs(srcNodes){
  const list = srcNodes || nodes;
  const filterSpecs = []; // {col, type, conditions}
  const orderSpecs = [];  // {col, type, direction}
  list.forEach(n=>{
    if(!n.filters) return;
    Object.keys(n.filters).forEach(col=>{
      const f = n.filters[col];
      if(!isFilterActive(f)) return;
      const colDef = SCHEMA[n.table].cols.find(c=>c[0]===col);
      const type = colDef ? colDef[1] : 'string';
      const meaningfulConds = (f.conditions||[]).filter(filterConditionIsMeaningful);
      if(meaningfulConds.length) filterSpecs.push({ col, type, conditions: meaningfulConds });
      if(f.order==='asc' || f.order==='desc') orderSpecs.push({ col, type, direction: f.order });
    });
  });
  return { filterSpecs, orderSpecs };
}

function collectGenerationColumns(cols, filterSpecs, orderSpecs){
  const map = new Map();
  cols.forEach(c=> map.set(c.col, c));
  filterSpecs.forEach(s=>{ if(!map.has(s.col)) map.set(s.col, {col:s.col, type:s.type}); });
  orderSpecs.forEach(s=>{ if(!map.has(s.col)) map.set(s.col, {col:s.col, type:s.type}); });
  return [...map.values()];
}

function valueMatchesCondition(rawVal, type, operator, filterVal){
  const isNumeric = (type==='int64' || type==='float64');
  const sVal = (rawVal===undefined || rawVal===null) ? '' : String(rawVal);
  switch(operator){
    case 'Is null': return sVal.trim()==='';
    case 'Is not null': return sVal.trim()!=='';
    case 'Distinct': return true; // handled as a post-process dedup, see getMatchesForFilters
    case 'Equals': return sVal.toLowerCase() === String(filterVal).toLowerCase();
    case 'Not equals': return sVal.toLowerCase() !== String(filterVal).toLowerCase();
    case 'Contains': return sVal.toLowerCase().includes(String(filterVal).toLowerCase());
    case 'Regex':
      try{ return new RegExp(filterVal, 'i').test(sVal); } catch(e){ return false; }
    case 'Greater than': case 'Less than': case 'Greater than or equals': case 'Less than or equals': {
      let a, b;
      if(isNumeric){ a = parseFloat(sVal); b = parseFloat(filterVal); if(isNaN(a)) return false; }
      else { a = sVal; b = String(filterVal); }
      if(operator==='Greater than') return a>b;
      if(operator==='Less than') return a<b;
      if(operator==='Greater than or equals') return a>=b;
      return a<=b; // Less than or equals
    }
  }
  return true;
}
function rowPassesFilterSpec(rowVals, spec){
  let result = null;
  spec.conditions.forEach((c,i)=>{
    const val = valueMatchesCondition(rowVals[spec.col], spec.type, c.operator, c.value);
    result = (i===0) ? val : ((c.connector==='OR') ? (result || val) : (result && val));
  });
  return result===null ? true : result;
}
function rowPassesAllFilters(rowVals, filterSpecs){
  return filterSpecs.every(spec=> rowPassesFilterSpec(rowVals, spec));
}

const FILTER_SCAN_LIMIT = TOTAL_ROWS; // scan the same bounded mock dataset when a filter/sort is active
let _filterCache = { key:null, matches:null };
function getMatchesForFilters(genCols, filterSpecs, orderSpecs){
  const key = JSON.stringify({ f:filterSpecs, o:orderSpecs, c:genCols.map(c=>c.col) });
  if(_filterCache.key===key) return _filterCache.matches;

  const rand = seedRandom(777 + genCols.length);
  const matches = [];
  for(let rowIdx=0; rowIdx<FILTER_SCAN_LIMIT; rowIdx++){
    const rowVals = {};
    genCols.forEach(c=>{ rowVals[c.col] = genValue(c.col, c.type, rand, rowIdx); });
    if(rowPassesAllFilters(rowVals, filterSpecs)) matches.push(rowVals);
  }
  // "Distinct" operator: dedupe on that column's value, keeping the first occurrence
  filterSpecs.forEach(spec=>{
    if(spec.conditions.some(c=>c.operator==='Distinct')){
      const seen = new Set();
      for(let i=matches.length-1;i>=0;i--){
        const k = String(matches[i][spec.col]);
        if(seen.has(k)) matches.splice(i,1); else seen.add(k);
      }
    }
  });
  if(orderSpecs.length){
    matches.sort((a,b)=>{
      for(const o of orderSpecs){
        const isNumeric = (o.type==='int64' || o.type==='float64');
        let av = a[o.col], bv = b[o.col];
        if(isNumeric){ av = parseFloat(av); bv = parseFloat(bv); }
        if(av<bv) return o.direction==='asc' ? -1 : 1;
        if(av>bv) return o.direction==='asc' ? 1 : -1;
      }
      return 0;
    });
  }
  _filterCache = { key, matches };
  return matches;
}

function renderData(page){
  const scroll = document.getElementById('dataScroll');
  const footer = document.getElementById('dataFooter');
  const cols = collectSelectedColumns(committedNodes);
  const noTables = committedNodes.length===0;
  const noColumns = !noTables && cols.length===0;
  const notJoined = committedNodes.length>1 && committedConns.length===0;

  if(noTables || noColumns || notJoined || !hasRunQuery){
    let msg = 'No data to display yet';
    if(notJoined) msg = 'Join the tables together to see data';
    else if(noColumns) msg = 'Select at least one column to see data';
    scroll.innerHTML = `<div class="empty-state">
      ${ICONS.table}
      <div>${msg}</div>
    </div>`;
    footer.innerHTML = '';
    return;
  }

  const { filterSpecs, orderSpecs } = collectActiveFilterSpecs(committedNodes);
  const hasFilterOrOrder = filterSpecs.length>0 || orderSpecs.length>0;
  const thead = '<tr>'+cols.map(c=>`<th>${c.col}</th>`).join('')+'</tr>';
  let rowsHtml = '', from, to, totalCount, totalPages;

  if(!hasFilterOrOrder){
    // ---- original fast path: no filters/sort active, generate this page directly ----
    const rand = seedRandom(1000*page + cols.length);
    const startIdx = (page-1)*ROWS_PER_PAGE;
    for(let i=0;i<ROWS_PER_PAGE;i++){
      const rowIdx = startIdx+i;
      rowsHtml += '<tr>'+cols.map(c=>`<td>${genValue(c.col,c.type,rand,rowIdx)}</td>`).join('')+'</tr>';
    }
    from = startIdx+1; to = Math.min(TOTAL_ROWS, startIdx+ROWS_PER_PAGE);
    totalCount = TOTAL_ROWS;
    totalPages = Math.ceil(TOTAL_ROWS/ROWS_PER_PAGE);
  } else {
    // ---- filtered/sorted path: materialize a bounded pool of matching rows, then paginate ----
    const genCols = collectGenerationColumns(cols, filterSpecs, orderSpecs);
    const matches = getMatchesForFilters(genCols, filterSpecs, orderSpecs);
    totalCount = matches.length;
    totalPages = Math.max(1, Math.ceil(totalCount/ROWS_PER_PAGE));
    if(page>totalPages) page = totalPages;
    if(page!==curPage) curPage = page;
    const startIdx = (page-1)*ROWS_PER_PAGE;
    const pageRows = matches.slice(startIdx, startIdx+ROWS_PER_PAGE);
    rowsHtml = pageRows.map(rv=> '<tr>'+cols.map(c=>`<td>${rv[c.col]}</td>`).join('')+'</tr>').join('');
    from = totalCount===0 ? 0 : startIdx+1;
    to = Math.min(totalCount, startIdx+ROWS_PER_PAGE);
  }

  scroll.innerHTML = rowsHtml
    ? `<table class="dgrid"><thead>${thead}</thead><tbody>${rowsHtml}</tbody></table>`
    : `<div class="empty-state">${ICONS.table}<div>No rows match the current filter${filterSpecs.length>1?'s':''}</div></div>`;

  // Fixed pagination layout logic
  let pager = `<button ${page===1?'disabled':''} data-p="${page-1}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
  </button>`;
  
  const pages = [];
  for(let p=1;p<=totalPages;p++){
    if(p<=3 || p>totalPages-3 || Math.abs(p-page)<=1) pages.push(p);
  }
  
  let last=0;
  pages.forEach(p=>{
    if(last && p-last>1) pager += `<button disabled>…</button>`;
    pager += `<button class="${p===page?'cur':''}" data-p="${p}">${p}</button>`;
    last=p;
  });
  
  pager += `<button ${page===totalPages?'disabled':''} data-p="${page+1}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
  </button>`;

  // Footer layout updated to contain both text, dropdown, and the paginator (responsive grouping)
  footer.innerHTML = `
    <div>Results : ${from}-${to} of ${totalCount.toLocaleString()}${hasFilterOrOrder?' (filtered)':''}</div>
    <div class="footer-right">
      <div class="footer-rpp">
        Rows Per Page :
        <button type="button" class="rpp-trigger" id="footerRppTrigger">
          <span class="rpp-trigger-label">${ROWS_PER_PAGE.toLocaleString()}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="pager">${pager}</div>
    </div>`;

  // Bind footer dropdown trigger (custom Rows Per Page control)
  attachRppTrigger(document.getElementById('footerRppTrigger'));

  footer.querySelectorAll('.pager button[data-p]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = parseInt(b.dataset.p,10);
      if(p>=1 && p<=totalPages){ curPage=p; renderData(curPage); }
    });
  });
}

attachRppTrigger(document.getElementById('rppTrigger'));

const RPP_PRESETS = [25,50,100,200,500];
let openRppMenu = null;
let rppClickTimer = null;

function getDataTotalCount(){
  const cols = collectSelectedColumns(committedNodes);
  const noTables = committedNodes.length===0;
  if(noTables || cols.length===0 || (committedNodes.length>1 && committedConns.length===0)) return 0;
  const { filterSpecs, orderSpecs } = collectActiveFilterSpecs(committedNodes);
  const hasFilterOrOrder = filterSpecs.length>0 || orderSpecs.length>0;
  if(!hasFilterOrOrder) return TOTAL_ROWS;
  const genCols = collectGenerationColumns(cols, filterSpecs, orderSpecs);
  return getMatchesForFilters(genCols, filterSpecs, orderSpecs).length;
}

function rppTriggerMarkup(){
  return `<span class="rpp-trigger-label">${ROWS_PER_PAGE.toLocaleString()}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
}

function applyRowsPerPage(v){
  v = Math.max(1, Math.floor(v));
  ROWS_PER_PAGE = v;
  curPage = 1;
  const toolbarTrigger = document.getElementById('rppTrigger');
  if(toolbarTrigger && !toolbarTrigger.classList.contains('editing')) toolbarTrigger.innerHTML = rppTriggerMarkup();
  if(activeTab==='data') renderData(curPage);
}

// Attaches the click (open menu) / double-click (inline edit) behavior to a trigger button.
// A short delay disambiguates a single click from the first half of a double click.
function attachRppTrigger(el){
  if(!el) return;
  el.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(el.classList.contains('editing')) return;
    if(rppClickTimer){ clearTimeout(rppClickTimer); rppClickTimer=null; return; }
    rppClickTimer = setTimeout(()=>{ rppClickTimer=null; toggleRppMenu(el); }, 220);
  });
  el.addEventListener('dblclick', (e)=>{
    e.stopPropagation();
    if(rppClickTimer){ clearTimeout(rppClickTimer); rppClickTimer=null; }
    closeRppMenu();
    startRppEdit(el);
  });
}

// Turns the trigger into an inline <input> so the user can type an exact custom value,
// the same way the font-size box works in Google Slides.
function startRppEdit(el){
  if(el.classList.contains('editing')) return;
  el.classList.add('editing');
  const total = getDataTotalCount();
  el.innerHTML = `<input type="number" class="rpp-edit-input" min="1" max="${total||999999}" value="${ROWS_PER_PAGE}">`;
  const input = el.querySelector('.rpp-edit-input');
  input.focus();
  input.select();
  input.addEventListener('click', e=>e.stopPropagation());
  input.addEventListener('dblclick', e=>e.stopPropagation());
  const finish = (commit)=>{
    if(commit){
      const v = parseInt(input.value, 10);
      if(v && v>0) applyRowsPerPage(total>0 ? Math.min(v,total) : v);
    }
    if(document.body.contains(el)){
      el.classList.remove('editing');
      el.innerHTML = rppTriggerMarkup();
    }
  };
  input.addEventListener('keydown', (e)=>{
    e.stopPropagation();
    if(e.key==='Enter') finish(true);
    else if(e.key==='Escape') finish(false);
  });
  input.addEventListener('blur', ()=> finish(true));
}

function toggleRppMenu(anchorEl){
  if(openRppMenu){ closeRppMenu(); return; }
  const total = getDataTotalCount();
  const menu = document.createElement('div');
  menu.className = 'rpp-popover';
  const presetsHtml = RPP_PRESETS.map(n=>
    `<button type="button" class="rpp-popover-item ${ROWS_PER_PAGE===n?'sel':''}" data-val="${n}">${n}</button>`
  ).join('');
  menu.innerHTML = `
    ${presetsHtml}
    <div class="rpp-popover-divider"></div>
    <button type="button" class="rpp-popover-item ${total>0 && ROWS_PER_PAGE===total?'sel':''}" data-val="${total}">${total.toLocaleString()}</button>
    <div class="rpp-popover-hint">Double-click the value to type a custom number</div>
  `;
  document.body.appendChild(menu);
  const r = anchorEl.getBoundingClientRect();
  menu.style.top = (r.bottom+6)+'px';
  let left = r.left;
  const maxLeft = window.innerWidth - 200;
  if(left > maxLeft) left = maxLeft;
  menu.style.left = Math.max(8,left)+'px';
  openRppMenu = menu;

  menu.querySelectorAll('.rpp-popover-item[data-val]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const v = parseInt(btn.dataset.val, 10);
      if(!v || v<1) return;
      applyRowsPerPage(v);
      closeRppMenu();
    });
  });

  setTimeout(()=> document.addEventListener('click', closeRppMenuOnce), 0);
}
function closeRppMenuOnce(){ closeRppMenu(); }
function closeRppMenu(){
  if(openRppMenu){ openRppMenu.remove(); openRppMenu=null; }
  document.removeEventListener('click', closeRppMenuOnce);
}

(function initPanelResize(){
  const panel = document.getElementById('bottomPanel');
  const handle = document.getElementById('panelResizeHandle');
  const MIN_H = 140;
  let dragging=false, startY=0, startH=0;

  function clampHeight(h){
    const maxH = window.innerHeight - 220;
    return Math.min(Math.max(h, MIN_H), Math.max(maxH, MIN_H));
  }
  function beginDrag(clientY){
    dragging = true; startY = clientY; startH = panel.getBoundingClientRect().height;
    panel.classList.remove('expanded'); panel.classList.add('resizing');
    document.body.style.userSelect = 'none'; document.body.style.cursor = 'row-resize';
  }
  function moveDrag(clientY){
    if(!dragging) return;
    const newH = clampHeight(startH - (clientY - startY));
    panel.style.flexBasis = newH + 'px';
  }
  function endDrag(){
    if(!dragging) return;
    dragging = false; panel.classList.remove('resizing');
    document.body.style.userSelect = ''; document.body.style.cursor = '';
  }

  handle.addEventListener('mousedown', (e)=>{ e.preventDefault(); beginDrag(e.clientY); });
  window.addEventListener('mousemove', (e)=>{ if(dragging) moveDrag(e.clientY); });
  window.addEventListener('mouseup', endDrag);

  handle.addEventListener('touchstart', (e)=>{ beginDrag(e.touches[0].clientY); }, {passive:true});
  window.addEventListener('touchmove', (e)=>{ if(dragging){ moveDrag(e.touches[0].clientY); } }, {passive:true});
  window.addEventListener('touchend', endDrag);

  handle.addEventListener('dblclick', ()=>{
    panel.style.flexBasis = ''; panel.classList.remove('expanded');
  });
})();

/* ============================================================
   PIVOT MODE — Google Sheets–style pivot table editor
   ============================================================
   The right-hand "Pivot table editor" panel has four sections — Rows,
   Columns, Values, Filters — each with its own "+ Add" button that opens
   a small searchable field picker. Every field placed in Rows/Columns
   gets its own Order / Sort by / Show totals controls; every field in
   Values gets Summarize by / Show as controls; every field in Filters
   opens a checkbox list of that column's distinct values. Any change
   recomputes and re-renders the results grid on the left immediately —
   there's no separate "Run" step, matching Sheets' live pivot table.
   ============================================================ */

/* ---------------- Floating popovers (field picker & filter values) ---------------- */
function pivotPopoverOutsideClick(e){
  if(pivotOpenPopoverEl && !pivotOpenPopoverEl.contains(e.target)) closePivotFloatingPopover();
}
function closePivotFloatingPopover(){
  if(pivotOpenPopoverEl){
    pivotOpenPopoverEl.remove();
    pivotOpenPopoverEl = null;
    document.removeEventListener('mousedown', pivotPopoverOutsideClick, true);
  }
}
function openPivotFloatingPopover(anchorEl, popEl){
  closePivotFloatingPopover();
  popEl.style.visibility = 'hidden';
  document.body.appendChild(popEl);
  const r = anchorEl.getBoundingClientRect();
  const pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  let left = Math.min(Math.max(8, r.right - pw), window.innerWidth - pw - 8);
  let top = r.bottom + 6;
  if(top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  popEl.style.top = top + 'px';
  popEl.style.left = left + 'px';
  popEl.style.visibility = '';
  pivotOpenPopoverEl = popEl;
  setTimeout(()=> document.addEventListener('mousedown', pivotPopoverOutsideClick, true), 0);
}

/* ---------------- Zone helpers ---------------- */
function pivotZoneArray(zone){
  return zone==='rows' ? pivotRows : zone==='cols' ? pivotCols : zone==='values' ? pivotValues : pivotFilters;
}
function valueFieldSortOptions(){
  return pivotValues.map(v=>({ id:String(v._id), label:`${AGG_LABELS[v.agg]} of ${v.label}` }));
}
function addPivotField(zone, field){
  if(zone==='rows' || zone==='cols'){
    pivotZoneArray(zone).push({ _id:++pivotFieldSeq, table:field.table, col:field.col, type:field.type,
      label:field.label, order:'asc', sortBy:'self', showTotals:true });
  } else if(zone==='values'){
    const isNumeric = field.type==='int64' || field.type==='float64';
    pivotValues.push({ _id:++pivotFieldSeq, table:field.table, col:field.col, type:field.type,
      label:field.label, agg: isNumeric ? 'sum' : 'count', showAs:'default' });
  }
}
function removePivotField(zone, id){
  if(zone==='rows') pivotRows = pivotRows.filter(x=>String(x._id)!==String(id));
  else if(zone==='cols') pivotCols = pivotCols.filter(x=>String(x._id)!==String(id));
  else if(zone==='values'){
    pivotValues = pivotValues.filter(x=>String(x._id)!==String(id));
    [...pivotRows, ...pivotCols].forEach(f=>{ if(String(f.sortBy)===String(id)) f.sortBy='self'; });
  } else if(zone==='filters') pivotFilters = pivotFilters.filter(x=>String(x._id)!==String(id));
  refreshPivotEditor();
  resetPivotResult();
}

/* ---------------- Field picker popover (Rows / Columns / Values / Filters "+ Add") ---------------- */
function openFieldPickerPopover(zone, anchorEl){
  const usedKeys = zone==='values' ? new Set() : new Set(pivotZoneArray(zone).map(x=>x.table+'\u0001'+x.col));
  const filterUsedKeys = new Set(pivotFilters.map(x=>x.table+'\u0001'+x.col));
  const pop = document.createElement('div');
  pop.className = 'pivot-popover pivot-field-popover';
  pop.innerHTML = `<input type="text" class="pivot-popover-search" placeholder="Search column ...">
    <div class="pivot-popover-list"></div>`;
  const listEl = pop.querySelector('.pivot-popover-list');
  const searchEl = pop.querySelector('.pivot-popover-search');
  function renderList(term){
    term = (term||'').trim().toLowerCase();
    const excl = zone==='filters' ? filterUsedKeys : usedKeys;
    const items = pivotFields.filter(f=> !excl.has(f.table+'\u0001'+f.col) && (!term || f.label.toLowerCase().includes(term)));
    listEl.innerHTML = items.length ? items.map(f=>`
      <button type="button" class="pivot-popover-item" data-table="${escapeAttr(f.table)}" data-col="${escapeAttr(f.col)}" data-type="${escapeAttr(f.type)}">
        <span class="pivot-popover-item-name">${escapeHtml(f.label)}</span>
        <span class="pivot-popover-item-type">${escapeHtml(f.type)}</span>
      </button>`).join('') : `<div class="pivot-field-empty">No matching columns</div>`;
    listEl.querySelectorAll('.pivot-popover-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const field = { table:btn.dataset.table, col:btn.dataset.col, type:btn.dataset.type, label:`${btn.dataset.table}.${btn.dataset.col}` };
        closePivotFloatingPopover();
        if(zone==='filters'){ addPivotFilterField(field); }
        else { addPivotField(zone, field); refreshPivotEditor(); resetPivotResult(); }
      });
    });
  }
  renderList('');
  searchEl.addEventListener('input', ()=> renderList(searchEl.value));
  openPivotFloatingPopover(anchorEl, pop);
  setTimeout(()=> searchEl.focus(), 0);
}

/* ---------------- Filters: distinct-value checklist popover ---------------- */
function getDistinctValuesForField(field){
  const rand = seedRandom(9001 + field.col.length*13 + field.table.length*7);
  const set = new Set();
  for(let i=0;i<TOTAL_ROWS;i++) set.add(String(genValue(field.col, field.type, rand, i)));
  return [...set].sort((a,b)=> a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}));
}
function addPivotFilterField(field){
  const allValues = getDistinctValuesForField(field);
  const item = { _id:++pivotFieldSeq, table:field.table, col:field.col, type:field.type, label:field.label,
    allValues, selected:new Set(allValues) };
  pivotFilters.push(item);
  refreshPivotEditor();
  resetPivotResult();
  setTimeout(()=>{
    const anchor = document.querySelector(`.pivot-filter-summary[data-filter-edit="${item._id}"]`);
    if(anchor) openPivotFilterValuesPopover(item, anchor);
  }, 20);
}
function openPivotFilterValuesPopover(item, anchorEl){
  const pop = document.createElement('div');
  pop.className = 'pivot-popover pivot-filter-popover';
  pop.innerHTML = `
    <input type="text" class="pivot-popover-search" placeholder="Search values ...">
    <div class="pivot-filter-actions">
      <button type="button" data-act="all">Select all</button>
      <button type="button" data-act="none">Clear</button>
    </div>
    <div class="pivot-filter-values"></div>
    <div class="pivot-filter-footer">
      <button type="button" class="pivot-btn-cancel" data-act="cancel">Cancel</button>
      <button type="button" class="pivot-btn-ok" data-act="ok">OK</button>
    </div>`;
  const localSelected = new Set(item.selected);
  const valuesEl = pop.querySelector('.pivot-filter-values');
  function renderValues(term){
    term = (term||'').trim().toLowerCase();
    const filtered = item.allValues.filter(v=> !term || v.toLowerCase().includes(term));
    valuesEl.innerHTML = filtered.length ? filtered.map(v=>`
      <label class="pivot-filter-item">
        <input type="checkbox" data-v="${escapeAttr(v)}" ${localSelected.has(v)?'checked':''}>
        <span>${escapeHtml(v)}</span>
      </label>`).join('') : `<div class="pivot-field-empty">No matching values</div>`;
    valuesEl.querySelectorAll('input[type=checkbox]').forEach(chk=>{
      chk.addEventListener('change', ()=>{ chk.checked ? localSelected.add(chk.dataset.v) : localSelected.delete(chk.dataset.v); });
    });
  }
  renderValues('');
  pop.querySelector('.pivot-popover-search').addEventListener('input', e=> renderValues(e.target.value));
  pop.querySelector('[data-act="all"]').addEventListener('click', ()=>{ item.allValues.forEach(v=>localSelected.add(v)); renderValues(pop.querySelector('.pivot-popover-search').value); });
  pop.querySelector('[data-act="none"]').addEventListener('click', ()=>{ localSelected.clear(); renderValues(pop.querySelector('.pivot-popover-search').value); });
  pop.querySelector('[data-act="cancel"]').addEventListener('click', closePivotFloatingPopover);
  pop.querySelector('[data-act="ok"]').addEventListener('click', ()=>{
    item.selected = new Set(localSelected);
    closePivotFloatingPopover();
    refreshPivotEditor();
    resetPivotResult();
  });
  openPivotFloatingPopover(anchorEl, pop);
}

/* ---------------- Aggregation engine ---------------- */
function round2(n){ return Math.round(n*100)/100; }
function mergeAggInto(target, agg){
  target.sum += agg.sum; target.count += agg.count;
  if(agg.min<target.min) target.min = agg.min;
  if(agg.max>target.max) target.max = agg.max;
}
function aggToValue(agg, aggType){
  switch(aggType){
    case 'count': return agg.count;
    case 'sum': return round2(agg.sum);
    case 'avg': return agg.count ? round2(agg.sum/agg.count) : 0;
    case 'min': return agg.count && isFinite(agg.min) ? round2(agg.min) : 0;
    case 'max': return agg.count && isFinite(agg.max) ? round2(agg.max) : 0;
    default: return 0;
  }
}
function formatShowAs(raw, vf, ctx){
  if(vf.showAs==='default' || typeof raw!=='number') return raw;
  const base = vf.showAs==='pct_grand' ? ctx.grandTotal : vf.showAs==='pct_row' ? ctx.rowTotal : ctx.colTotal;
  return base ? (raw/base*100).toFixed(1)+'%' : '0.0%';
}
function compareLabels(la, lb, type){
  if(type==='int64' || type==='float64') return (parseFloat(la)||0) - (parseFloat(lb)||0);
  return String(la).localeCompare(String(lb), undefined, {numeric:true, sensitivity:'base'});
}

function computePivotResult(){
  const neededCols = new Map();
  [...pivotRows, ...pivotCols, ...pivotValues, ...pivotFilters].forEach(f=>{
    if(!neededCols.has(f.col)) neededCols.set(f.col, { col:f.col, type:f.type });
  });
  const genCols = [...neededCols.values()];
  const rand = seedRandom(4242 + genCols.length + pivotRows.length*7 + pivotCols.length*13);
  let sourceRows = [];
  for(let i=0;i<TOTAL_ROWS;i++){
    const rv = {};
    genCols.forEach(c=>{ rv[c.col] = genValue(c.col, c.type, rand, i); });
    sourceRows.push(rv);
  }
  if(pivotFilters.length){
    sourceRows = sourceRows.filter(rv=> pivotFilters.every(f=> f.selected.has(String(rv[f.col]))));
  }

  const rowKeyOf = rv => pivotRows.map(f=>String(rv[f.col])).join('\u0001');
  const rowLabelOf = rv => pivotRows.map(f=>String(rv[f.col]));
  const colKeyOf = rv => pivotCols.map(f=>String(rv[f.col])).join('\u0001');
  const colLabelOf = rv => pivotCols.map(f=>String(rv[f.col])).join(' / ');

  const rowMap = new Map();   // rowKey -> label array
  const colMap = new Map();   // colKey -> label string
  let colsTruncated = false;
  sourceRows.forEach(rv=>{
    const rk = rowKeyOf(rv);
    if(!rowMap.has(rk)) rowMap.set(rk, rowLabelOf(rv));
    const ck = colKeyOf(rv);
    if(!colMap.has(ck)){
      if(colMap.size < PIVOT_MAX_COLS) colMap.set(ck, colLabelOf(rv));
      else colsTruncated = true;
    }
  });

  // buckets: rowKey -> Map(colKey -> [{sum,count,min,max} per value field])
  const buckets = new Map();
  sourceRows.forEach(rv=>{
    const ck = colKeyOf(rv);
    if(!colMap.has(ck)) return; // beyond the column cap
    const rk = rowKeyOf(rv);
    if(!buckets.has(rk)) buckets.set(rk, new Map());
    const rowBucket = buckets.get(rk);
    if(!rowBucket.has(ck)) rowBucket.set(ck, pivotValues.map(()=>({sum:0,count:0,min:Infinity,max:-Infinity})));
    const cellArr = rowBucket.get(ck);
    pivotValues.forEach((vf,vi)=>{
      const raw = rv[vf.col];
      const num = parseFloat(raw);
      const isNum = !isNaN(num) && raw!=='' && raw!==null && raw!==undefined;
      const agg = cellArr[vi];
      agg.count += 1;
      if(isNum){ agg.sum += num; if(num<agg.min) agg.min=num; if(num>agg.max) agg.max=num; }
    });
  });

  // Margins (row totals / column totals / grand total), computed straight from the
  // raw buckets so SUM/COUNT/AVERAGE/MIN/MAX all total up correctly — not just SUM.
  const emptyAgg = ()=> pivotValues.map(()=>({sum:0,count:0,min:Infinity,max:-Infinity}));
  const rowMargin = new Map();
  buckets.forEach((rowBucket, rk)=>{
    const merged = emptyAgg();
    rowBucket.forEach((cellArr, ck)=>{ if(colMap.has(ck)) cellArr.forEach((agg,vi)=> mergeAggInto(merged[vi], agg)); });
    rowMargin.set(rk, merged);
  });
  const colMargin = new Map();
  colMap.forEach((_, ck)=>{
    const merged = emptyAgg();
    buckets.forEach(rowBucket=>{ const cellArr = rowBucket.get(ck); if(cellArr) cellArr.forEach((agg,vi)=> mergeAggInto(merged[vi], agg)); });
    colMargin.set(ck, merged);
  });
  const grandMerge = emptyAgg();
  rowMargin.forEach(merged=> merged.forEach((agg,vi)=> mergeAggInto(grandMerge[vi], agg)));

  const rowTotalFor = (rk,vi) => aggToValue(rk==='__grand__' ? grandMerge[vi] : (rowMargin.get(rk)||emptyAgg())[vi], pivotValues[vi].agg);
  const colTotalFor = (ck,vi) => aggToValue(ck==='__grand__' ? grandMerge[vi] : (colMargin.get(ck)||emptyAgg())[vi], pivotValues[vi].agg);
  const grandTotalFor = (vi) => aggToValue(grandMerge[vi], pivotValues[vi].agg);

  // Sort rows / columns using the first field's Order + Sort by (matches the
  // common single-field case shown in the editor; extra fields still group
  // the data, they just don't add secondary sort keys).
  let rowKeys = [...rowMap.keys()];
  const rowSortField = pivotRows[0];
  if(rowSortField){
    const dir = rowSortField.order==='desc' ? -1 : 1;
    if(rowSortField.sortBy==='self'){
      rowKeys.sort((a,b)=> compareLabels(rowMap.get(a)[0], rowMap.get(b)[0], rowSortField.type)*dir);
    } else {
      const vi = pivotValues.findIndex(v=>String(v._id)===String(rowSortField.sortBy));
      rowKeys = vi<0 ? rowKeys.sort((a,b)=>compareLabels(rowMap.get(a)[0],rowMap.get(b)[0],rowSortField.type)*dir)
        : rowKeys.sort((a,b)=> (rowTotalFor(a,vi)-rowTotalFor(b,vi))*dir);
    }
  } else {
    rowKeys.sort((a,b)=> a.localeCompare(b));
  }
  let colKeys = [...colMap.keys()];
  const colSortField = pivotCols[0];
  if(colSortField){
    const dir = colSortField.order==='desc' ? -1 : 1;
    if(colSortField.sortBy==='self'){
      colKeys.sort((a,b)=> compareLabels(colMap.get(a), colMap.get(b), colSortField.type)*dir);
    } else {
      const vi = pivotValues.findIndex(v=>String(v._id)===String(colSortField.sortBy));
      colKeys = vi<0 ? colKeys.sort((a,b)=>compareLabels(colMap.get(a),colMap.get(b),colSortField.type)*dir)
        : colKeys.sort((a,b)=> (colTotalFor(a,vi)-colTotalFor(b,vi))*dir);
    }
  } else {
    colKeys.sort((a,b)=> a.localeCompare(b));
  }

  const showGrandTotalRow = pivotRows.length>0 && pivotRows.every(f=>f.showTotals!==false);
  const showGrandTotalCol = pivotCols.length>0 && pivotCols.every(f=>f.showTotals!==false);
  const singleValue = pivotValues.length===1;

  // Headers: one per (column group × value field), plus a trailing "Grand Total" group if enabled.
  const headers = [];
  colKeys.forEach(ck=>{
    const label = colMap.get(ck);
    pivotValues.forEach((vf,vi)=>{
      const valueLabel = `${AGG_LABELS[vf.agg]} of ${vf.label}`;
      const text = label ? (singleValue ? label : `${valueLabel} - ${label}`) : valueLabel;
      headers.push({ colKey:ck, valIdx:vi, text, isGrandCol:false });
    });
  });
  if(showGrandTotalCol){
    pivotValues.forEach((vf,vi)=>{
      headers.push({ colKey:'__grand__', valIdx:vi, text: singleValue ? 'Grand Total' : `Grand Total (${vf.label})`, isGrandCol:true });
    });
  }

  function buildCell(rk, ck, vi){
    const vf = pivotValues[vi];
    let raw;
    if(rk==='__grand__' && ck==='__grand__') raw = grandTotalFor(vi);
    else if(rk==='__grand__') raw = colTotalFor(ck, vi);
    else if(ck==='__grand__') raw = rowTotalFor(rk, vi);
    else {
      const cellArr = buckets.get(rk) && buckets.get(rk).get(ck);
      raw = cellArr ? aggToValue(cellArr[vi], vf.agg) : 0;
    }
    const ctx = { rowTotal: rowTotalFor(rk,vi), colTotal: colTotalFor(ck,vi), grandTotal: grandTotalFor(vi) };
    return { value: formatShowAs(raw, vf, ctx), isGrandRow: rk==='__grand__', isGrandCol: ck==='__grand__' };
  }

  const rows = rowKeys.map(rk=>({
    rowLabel: rowMap.get(rk),
    cells: headers.map(h=> buildCell(rk, h.colKey, h.valIdx))
  }));
  if(showGrandTotalRow){
    rows.push({
      rowLabel: pivotRows.map((f,i)=> i===0 ? 'Grand Total' : ''),
      cells: headers.map(h=> buildCell('__grand__', h.colKey, h.valIdx)),
      isGrandTotalRow: true
    });
  }

  pivotResult = { rowFieldLabels: pivotRows.map(f=>f.label), headers, rows, colsTruncated };
}

function resetPivotResult(){
  pivotHasRun = false; pivotResult = null; pivotCurPage = 1;
  renderPivotResults();
}

function runPivotNow(){
  if(pivotRows.length===0 || pivotCols.length===0 || pivotValues.length===0){
    pivotHasRun = false; pivotResult = null; pivotCurPage = 1;
    renderPivotResults();
    showToast('error','Add a field to Rows, Columns and Values before running');
    return;
  }
  computePivotResult();
  pivotHasRun = true;
  pivotCurPage = 1;
  renderPivotResults();
}

function buildPagerHtml(page, totalPages){
  let pager = `<button ${page===1?'disabled':''} data-p="${page-1}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
  </button>`;
  const pages = [];
  for(let p=1;p<=totalPages;p++){ if(p<=3 || p>totalPages-3 || Math.abs(p-page)<=1) pages.push(p); }
  let last=0;
  pages.forEach(p=>{
    if(last && p-last>1) pager += `<button disabled>…</button>`;
    pager += `<button class="${p===page?'cur':''}" data-p="${p}">${p}</button>`;
    last=p;
  });
  pager += `<button ${page===totalPages?'disabled':''} data-p="${page+1}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
  </button>`;
  return pager;
}
function renderPivotResults(){
  const scroll = document.getElementById('pivotDataScroll');
  const footer = document.getElementById('pivotDataFooter');
  const toolbar = document.getElementById('pivotDataToolbarRow');

  const noResult = !pivotHasRun || !pivotResult || pivotResult.rows.length===0 || pivotResult.headers.length===0;
  toolbar.innerHTML = pivotToolbarMarkup(!noResult);
  wirePivotToolbarButtons();

  if(noResult){
    const msg = (pivotRows.length===0 || pivotCols.length===0 || pivotValues.length===0)
      ? 'Add a field to Rows, Columns and Values, then click Run'
      : 'Click Run to build the pivot table';
    scroll.innerHTML = `<div class="empty-state">${ICONS.table}<div>${msg}</div></div>`;
    footer.innerHTML = '';
    return;
  }

  const { rowFieldLabels, headers, rows, colsTruncated } = pivotResult;
  const totalCount = rows.length;
  const totalPages = Math.max(1, Math.ceil(totalCount/pivotRPP));
  if(pivotCurPage>totalPages) pivotCurPage = totalPages;
  const startIdx = (pivotCurPage-1)*pivotRPP;
  const pageRows = rows.slice(startIdx, startIdx+pivotRPP);

  const thead = '<tr>'
    + rowFieldLabels.map(l=>`<th>${escapeHtml(l)}</th>`).join('')
    + headers.map(h=>`<th${h.isGrandCol?' class="gt-cell"':''}>${escapeHtml(h.text)}</th>`).join('')
    + '</tr>';
  const tbody = pageRows.map(r=>
    `<tr${r.isGrandTotalRow?' class="gt-row"':''}>`
    + r.rowLabel.map(v=>`<td>${escapeHtml(v)}</td>`).join('')
    + r.cells.map(c=>`<td${(c.isGrandRow||c.isGrandCol)?' class="gt-cell"':''}>${escapeHtml(String(c.value))}</td>`).join('')
    + '</tr>'
  ).join('');

  scroll.innerHTML = `<table class="dgrid"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;

  const from = totalCount===0 ? 0 : startIdx+1;
  const to = Math.min(totalCount, startIdx+pivotRPP);
  const pager = buildPagerHtml(pivotCurPage, totalPages);

  footer.innerHTML = `
    <div>Results : ${from}-${to} of ${totalCount.toLocaleString()}${colsTruncated?` • columns capped at ${PIVOT_MAX_COLS}`:''}</div>
    <div class="footer-right">
      <div class="footer-rpp">
        Rows Per Page :
        <button type="button" class="rpp-trigger" id="pivotFooterRppTrigger">
          <span class="rpp-trigger-label">${pivotRPP.toLocaleString()}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="pager">${pager}</div>
    </div>`;
  attachPivotRppTrigger(document.getElementById('pivotFooterRppTrigger'));
  footer.querySelectorAll('.pager button[data-p]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const p = parseInt(b.dataset.p,10);
      if(p>=1 && p<=totalPages){ pivotCurPage=p; renderPivotResults(); }
    });
  });
}
function exportPivotCsv(){
  const table = document.querySelector('#pivotDataScroll table.dgrid');
  if(!table){ showToast('info','No data to export yet'); return; }
  const escapeCsv = (text)=>{ const t = text.replace(/"/g,'""'); return /[",\n]/.test(t) ? `"${t}"` : t; };
  const csvRows = [...table.querySelectorAll('tr')].map(tr=> [...tr.children].map(cell=> escapeCsv(cell.textContent)).join(','));
  const blob = new Blob([csvRows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'pivot_export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('success','CSV exported successfully');
}

/* Rows-per-page control for the pivot results panel — kept independent
   from the Visual Query data tab's version so the two modes never interfere. */
let pivotRppClickTimer = null;
let pivotOpenRppMenu = null;
function attachPivotRppTrigger(el){
  if(!el) return;
  el.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(el.classList.contains('editing')) return;
    if(pivotRppClickTimer){ clearTimeout(pivotRppClickTimer); pivotRppClickTimer=null; return; }
    pivotRppClickTimer = setTimeout(()=>{ pivotRppClickTimer=null; togglePivotRppMenu(el); }, 220);
  });
  el.addEventListener('dblclick', (e)=>{
    e.stopPropagation();
    if(pivotRppClickTimer){ clearTimeout(pivotRppClickTimer); pivotRppClickTimer=null; }
    closePivotRppMenu();
    startPivotRppEdit(el);
  });
}
function startPivotRppEdit(el){
  if(el.classList.contains('editing')) return;
  el.classList.add('editing');
  const total = pivotResult ? pivotResult.rows.length : 0;
  el.innerHTML = `<input type="number" class="rpp-edit-input" min="1" max="${total||999999}" value="${pivotRPP}">`;
  const input = el.querySelector('.rpp-edit-input');
  input.focus(); input.select();
  input.addEventListener('click', e=>e.stopPropagation());
  input.addEventListener('dblclick', e=>e.stopPropagation());
  const finish = (commit)=>{
    if(commit){
      const v = parseInt(input.value,10);
      if(v && v>0) applyPivotRowsPerPage(total>0 ? Math.min(v,total) : v);
    }
    if(document.body.contains(el)){
      el.classList.remove('editing');
      el.innerHTML = `<span class="rpp-trigger-label">${pivotRPP.toLocaleString()}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
    }
  };
  input.addEventListener('keydown', (e)=>{
    e.stopPropagation();
    if(e.key==='Enter') finish(true);
    else if(e.key==='Escape') finish(false);
  });
  input.addEventListener('blur', ()=>finish(true));
}
function togglePivotRppMenu(anchorEl){
  if(pivotOpenRppMenu){ closePivotRppMenu(); return; }
  const total = pivotResult ? pivotResult.rows.length : 0;
  const menu = document.createElement('div');
  menu.className = 'rpp-popover';
  const presetsHtml = RPP_PRESETS.map(n=>
    `<button type="button" class="rpp-popover-item ${pivotRPP===n?'sel':''}" data-val="${n}">${n}</button>`
  ).join('');
  menu.innerHTML = `
    ${presetsHtml}
    <div class="rpp-popover-divider"></div>
    <button type="button" class="rpp-popover-item ${total>0 && pivotRPP===total?'sel':''}" data-val="${total}">${total.toLocaleString()}</button>
    <div class="rpp-popover-hint">Double-click the value to type a custom number</div>
  `;
  document.body.appendChild(menu);
  const r = anchorEl.getBoundingClientRect();
  menu.style.top = (r.bottom+6)+'px';
  let left = r.left;
  const maxLeft = window.innerWidth - 200;
  if(left > maxLeft) left = maxLeft;
  menu.style.left = Math.max(8,left)+'px';
  pivotOpenRppMenu = menu;

  menu.querySelectorAll('.rpp-popover-item[data-val]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const v = parseInt(btn.dataset.val, 10);
      if(!v || v<1) return;
      applyPivotRowsPerPage(v);
      closePivotRppMenu();
    });
  });
  setTimeout(()=> document.addEventListener('click', closePivotRppMenuOnce), 0);
}
function closePivotRppMenuOnce(){ closePivotRppMenu(); }
function closePivotRppMenu(){
  if(pivotOpenRppMenu){ pivotOpenRppMenu.remove(); pivotOpenRppMenu=null; }
  document.removeEventListener('click', closePivotRppMenuOnce);
}
function applyPivotRowsPerPage(v){
  v = Math.max(1, Math.floor(v));
  pivotRPP = v;
  pivotCurPage = 1;
  renderPivotResults();
}

let sqState = null; let sqActiveTab = 'details';

function openSaveQueryModal(){
  const cols = collectSelectedColumns();
  sqState = {
    title: 'Data Quality Pipeline Results (Simulated Data)',
    description: 'Data simulated via generate_complex_data() and processed through Monad-based Pipeline before exporting to Hive-Partitioned Parquet with Quality Summary embedded in Footer Metadata.',
    publisher: 'Data Engineering Team (Internal Colab Notebook)',
    category: SQ_CATEGORY_OPTIONS[0], keywordsList: [], keywordDraft: '',
    updateFrequency: SQ_FREQ_OPTIONS[0], visibility: SQ_VISIBILITY_OPTIONS[0], license: SQ_LICENSE_OPTIONS[0],
    columns: cols.length ? cols.map(c=>({ name: `${c.table}.${c.col}`, type: sqTypeLabel(c.type), description: '' })) : [ {name:'', type:SQ_TYPE_OPTIONS[0], description:''} ]
  };
  sqActiveTab = 'details'; renderSaveQueryModal();
}
function closeSaveQueryModal(){ document.getElementById('modalHost').innerHTML = ''; sqState = null; }
function sqValid(){
  return !!(sqState && sqState.title.trim() && sqState.description.trim() && sqState.publisher.trim() && sqState.category && sqState.keywordsList.length>0 && sqState.updateFrequency && sqState.visibility && sqState.license);
}
function sqSyncSaveBtn(){ const btn = document.getElementById('sqSaveBtn'); if(btn) btn.disabled = !sqValid(); }

function renderSaveQueryModal(){
  const host = document.getElementById('modalHost');
  if(!sqState) return;
  const tabsHtml = `
    <button class="sq-tab ${sqActiveTab==='details'?'active':''}" data-sqtab="details">Data Product Details</button>
    <button class="sq-tab ${sqActiveTab==='cols'?'active':''}" data-sqtab="cols">Data Dictionary</button>
  `;
  let bodyHtml = '';
  if(sqActiveTab==='details'){
    bodyHtml = `
      <div class="sq-desc">Fill in the dataset metadata according to the DGA (Digital Government Development Agency) standard fields.</div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Title :</label>
        <input type="text" class="sq-input" id="sqTitle" placeholder="เช่น รายชื่อโรงพยาบาลรัฐและสถานพยาบาลทั่วประเทศ" value="${escapeAttr(sqState.title)}">
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Description :</label>
        <textarea class="sq-textarea" id="sqDescription" style="min-height:80px" placeholder="เช่น ข้อมูลพิกัดที่ตั้ง เบอร์ติดต่อ และจำนวนเตียง ของโรงพยาบาลรัฐทั่วประเทศ">${escapeHtml(sqState.description)}</textarea>
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Publisher :</label>
        <input type="text" class="sq-input" id="sqPublisher" placeholder="เช่น สำนักงานปลัดกระทรวงสาธารณสุข" value="${escapeAttr(sqState.publisher)}">
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Category :</label>
        <select class="sq-input" id="sqCategory">
          <option value="" ${sqState.category===''?'selected':''} disabled>-- เลือกหมวดหมู่ --</option>
          ${SQ_CATEGORY_OPTIONS.map(o=>`<option value="${escapeAttr(o)}" ${o===sqState.category?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Tags / Keywords :</label>
        <div class="sq-keywords-box" id="sqKwBox">${sqState.keywordsList.map((k,i)=>`<span class="kw-chip">${escapeHtml(k)}<button type="button" data-kwdel="${i}" title="Remove">${ICONS.close}</button></span>`).join('')}</div>
        <input type="text" class="sq-input" id="sqKwInput" placeholder="พิมพ์คำสำคัญแล้วกด Enter เพื่อเพิ่ม เช่น โรงพยาบาล, เตียงผู้ป่วย" value="${escapeAttr(sqState.keywordDraft)}">
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Update Frequency :</label>
        <select class="sq-input" id="sqUpdateFreq">
          <option value="" ${sqState.updateFrequency===''?'selected':''} disabled>-- เลือกความถี่ --</option>
          ${SQ_FREQ_OPTIONS.map(o=>`<option value="${escapeAttr(o)}" ${o===sqState.updateFrequency?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
      <div class="sq-field">
        <label class="sq-label"><span class="req">*</span>Visibility :</label>
        <select class="sq-input" id="sqVisibility">
          ${SQ_VISIBILITY_OPTIONS.map(o=>`<option value="${escapeAttr(o)}" ${o===sqState.visibility?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
      <div class="sq-field" style="margin-bottom:4px;">
        <label class="sq-label"><span class="req">*</span>License :</label>
        <select class="sq-input" id="sqLicense">
          ${SQ_LICENSE_OPTIONS.map(o=>`<option value="${escapeAttr(o)}" ${o===sqState.license?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="sq-desc">Metadata for the specific data columns generated by this query. Read-only.</div>
      <div class="sq-table-wrap">
        <table class="sq-table">
          <colgroup><col style="width:30%"><col style="width:18%"><col></colgroup>
          <thead><tr><th>Column Name</th><th>Data Type</th><th>Description</th></tr></thead>
          <tbody>
            ${sqState.columns.map((c)=>`
              <tr>
                <td>${escapeHtml(c.name)}</td>
                <td>${escapeHtml(c.type)}</td>
                <td>${escapeHtml(c.description)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  host.innerHTML = `
    <div class="modal-backdrop-lg" id="sqBackdrop">
      <div class="sq-modal">
        <div class="sq-header">
          <div class="sq-title">Save Query</div>
          <div class="sq-tabs">${tabsHtml}</div>
        </div>
        <div class="sq-body">${bodyHtml}</div>
        <div class="sq-footer">
          <button class="sq-btn sq-btn-cancel" id="sqCancelBtn">${ICONS.close} Cancel</button>
          <button class="sq-btn sq-btn-save" id="sqSaveBtn" ${sqValid()?'':'disabled'}>${ICONS.check} Save</button>
        </div>
      </div>
    </div>`;
  wireSaveQueryModal();
}

function wireSaveQueryModal(){
  document.querySelectorAll('.sq-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ sqActiveTab = btn.dataset.sqtab; renderSaveQueryModal(); });
  });
  document.getElementById('sqBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='sqBackdrop') closeSaveQueryModal(); });
  document.getElementById('sqCancelBtn').addEventListener('click', closeSaveQueryModal);
  document.getElementById('sqSaveBtn').addEventListener('click', ()=>{
    if(!sqValid()) return;
    const title = sqState.title; const cols = sqState.columns; closeSaveQueryModal(); addSavedView(title, cols);
    showToast('success', `Query "${title}" saved successfully and a view has been created`);
  });

  if(sqActiveTab==='details'){
    const titleEl = document.getElementById('sqTitle'); titleEl.addEventListener('input', ()=>{ sqState.title = titleEl.value; sqSyncSaveBtn(); });
    const descEl = document.getElementById('sqDescription'); descEl.addEventListener('input', ()=>{ sqState.description = descEl.value; sqSyncSaveBtn(); });
    const pubEl = document.getElementById('sqPublisher'); pubEl.addEventListener('input', ()=>{ sqState.publisher = pubEl.value; sqSyncSaveBtn(); });
    const catEl = document.getElementById('sqCategory'); catEl.addEventListener('change', ()=>{ sqState.category = catEl.value; sqSyncSaveBtn(); });
    const kwInput = document.getElementById('sqKwInput'); kwInput.addEventListener('input', ()=>{ sqState.keywordDraft = kwInput.value; });
    kwInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault(); const v = kwInput.value.trim();
        if(v && !sqState.keywordsList.includes(v)){ sqState.keywordsList.push(v); sqState.keywordDraft = ''; renderSaveQueryModal(); }
      }
    });
    document.querySelectorAll('[data-kwdel]').forEach(b=>{
      b.addEventListener('click', ()=>{ sqState.keywordsList.splice(+b.dataset.kwdel, 1); renderSaveQueryModal(); });
    });
    const freqEl = document.getElementById('sqUpdateFreq'); freqEl.addEventListener('change', ()=>{ sqState.updateFrequency = freqEl.value; sqSyncSaveBtn(); });
    const visEl = document.getElementById('sqVisibility'); visEl.addEventListener('change', ()=>{ sqState.visibility = visEl.value; sqSyncSaveBtn(); });
    const licEl = document.getElementById('sqLicense'); licEl.addEventListener('change', ()=>{ sqState.license = licEl.value; sqSyncSaveBtn(); });
  }

}

function showToast(type, msg){
  const host = document.getElementById('toastHost');
  const t = document.createElement('div'); t.className = 'toast '+type;
  t.innerHTML = (type==='success'?ICONS.check.replace('stroke-width="3"','stroke="currentColor" stroke-width="3"'):ICONS.info)+`<span>${msg}</span>`;
  host.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),250); }, 2600);
}

document.getElementById('btnExportCsv').addEventListener('click', ()=>{
  const table = document.querySelector('#dataScroll table.dgrid');
  if(!table){ showToast('info','No data to export yet'); return; }
  const escapeCsv = (text)=>{ const t = text.replace(/"/g,'""'); return /[",\n]/.test(t) ? `"${t}"` : t; };
  const csvRows = [...table.querySelectorAll('tr')].map(tr=> [...tr.children].map(cell=> escapeCsv(cell.textContent)).join(',') );
  const blob = new Blob([csvRows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('success','CSV exported successfully');
});

/* ============================================================
   INIT
   ============================================================ */
buildSidebar();
seedInitialState();
initCanvasDropZone();
applyZoom();
render();
setTab('data');
</script>
</body>
